    <style>
/*
 * tokens.css — 西游记可视化站点公共设计令牌
 * ----------------------------------------------
 * v3 · W476 纸感轻立体（在 v2/W334 基础上增层 · 见 DESIGN.md §4A）
 * 全站统一设计令牌 + 字体分层 + hero 覆写层。
 *
 * 引用方式（必须放在页面内联 <style> 之后，确保级联覆盖）：
 *   <link rel="stylesheet" href="../tokens.css">  (data/ 子目录页面)
 *   <link rel="stylesheet" href="tokens.css">      (site/ 根页面)
 *
 * 设计原则：
 *   - 宣纸暖白为底、墨褐为骨，朱砂为唯一彩色强调
 *   - 标题宋体 / 正文黑体 / 数字等宽，三层字体分工
 *   - 小圆角 + 四级纸感海拔（v3）· 1px 发丝线分隔 · 大留白
 *   - 图表五色雅集色板：朱砂/靛蓝/赭金/苔绿/米灰（+ 赭石备用）
 */

/* ===== 子集化 webfont（W334 · 本地托管 · file:// 可用 · 零外部依赖） ===== */
/* 字体文件位于 site/static/fonts/，由 scripts/w334_font_subset.py 生成（~3,700 字） */
/* 思源宋体为可变字重（wght 200-900），标题/正文按需取重 */
@font-face {
    font-family: 'Noto Serif SC';
    font-style: normal;
    font-weight: 200 900;
    font-display: optional;
    src: url('static/fonts/noto-serif-sc-shared.woff2') format('woff2-variations');
}
@font-face {
    font-family: 'Noto Sans SC';
    font-style: normal;
    font-weight: 400;
    font-display: optional;
    src: url('static/fonts/NotoSansSC-Regular.woff2') format('woff2');
}
@font-face {
    font-family: 'Noto Sans SC';
    font-style: normal;
    font-weight: 500;
    font-display: optional;
    src: url('static/fonts/NotoSansSC-Medium.woff2') format('woff2');
}
@font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('static/fonts/JetBrainsMono-Regular.woff2') format('woff2');
}
@font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('static/fonts/JetBrainsMono-Medium.woff2') format('woff2');
}

:root {
    color-scheme: light;

    /* —— 背景 / 纸张 —— */
    --bg: #FAF7F0;            /* 页面整体背景：宣纸暖白 */
    --paper: #FFFFFF;         /* 卡片 / section 内容区背景 */
    --paper-warm: #F1EBDD;    /* 暖调浅底：注条 / 徽band底 */
    --dark: #221D16;          /* 玄墨深色区块（开篇诗 / 深色节奏段） */
    --dark-text: #F2EBDC;     /* 深色区块上的文字 */

    /* —— 文字 —— */
    --ink: #23201A;           /* 主文字：墨 */
    --ink-soft: #6B6455;      /* 次级文字：浅墨 */
    --ink-faint: #9A9280;     /* 三级文字：淡墨（meta / 编号） */

    /* —— 主辅配色（朱砂单点强调） —— */
    --accent: #C8463A;        /* 主强调色：朱砂红（全站唯一彩色强调） */
    --accent-soft: #E9B885;   /* 浅赭金：徽章底 / 渐变高光 */
    --accent-2: #3A6B8C;      /* 靛蓝：链接 / 数据 meta / 第二系列 */
    --accent-3: #8A6D3B;      /* 赭石：提示文字 / 第三系列 */
    --accent-4: #6B8E5A;      /* 苔绿：正向数据 / 第四系列 */
    --rebel: #8C2A2A;         /* 反派 / 警示色：暗朱红 */

    /* —— 图表五色雅集色板（W334 图表规范） —— */
    --chart-1: #C8463A;       /* 朱砂 */
    --chart-2: #3A6B8C;       /* 靛蓝 */
    --chart-3: #C9A063;       /* 赭金 */
    --chart-4: #6B8E5A;       /* 苔绿 */
    --chart-5: #D8CFBC;       /* 米灰 */
    --chart-6: #8A6D3B;       /* 赭石（备用第 6 系列） */

    /* —— 分隔线 —— */
    --line: #E5DFD0;          /* 发丝线：浅米褐 */

    /* —— 阴影（克制，仅卡片浮起用） —— */
    --shadow: 0 1px 3px rgba(35, 32, 26, 0.06), 0 4px 12px rgba(35, 32, 26, 0.05);
    --shadow-lift: 0 2px 6px rgba(35, 32, 26, 0.08), 0 8px 24px rgba(35, 32, 26, 0.08);

    /* —— 动效令牌（W460 墨韵动效体系：时长三级 + 缓动三系） —— */
    /* 时长：fast 即时反馈 / base 状态变化 / slow 入场编排（克制雅致，不上弹跳） */
    --dur-fast: 150ms;        /* 按压、toggle、色彩切换 */
    --dur-base: 250ms;        /* hover、行高亮、tooltip */
    --dur-slow: 500ms;        /* 卡片入场、区块 reveal */
    /* 缓动：内容抵达用 ease-out 系；弃用裸 ease 关键字 */
    --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);      /* 均匀精致·默认 */
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);       /* 果断自信·大位移入场 */
    --ease-in-out-soft: cubic-bezier(0.65, 0, 0.35, 1);   /* 往返对称·展开收起 */

    /* —— 字体三层分工 —— */
    --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', serif;
    --font-sans: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
}

/* ===== v3 · W476 纸感轻立体令牌层（DESIGN.md §4A） ===== */
/* 断点常量：640/768/1024/1280/1536 · 最小验收 375 */
:root {
    /* —— 四级海拔（hover +1 档 · 悬浮 ≥3 · 禁硬编码阴影） —— */
    --elev-0: none;
    --elev-1: var(--shadow);
    --elev-2: var(--shadow-lift);
    --elev-3: 0 4px 10px rgba(35, 32, 26, 0.10), 0 12px 32px rgba(35, 32, 26, 0.12);
    --elev-4: 0 8px 18px rgba(35, 32, 26, 0.14), 0 24px 56px rgba(35, 32, 26, 0.16);

    /* —— 圆角 / 边框 —— */
    --radius-sm: 2px;  --radius-md: 6px;  --radius-lg: 10px;  --radius-pill: 999px;
    --border-hairline: 1px solid var(--line);
    --border-accent: 1px solid var(--accent);

    /* —— 色阶派生（深档 hex 兜底 · 浅档 color-mix 优雅降级） —— */
    --accent-deep: #AF3F34;  /* 700 档：active/按钮渐变终点 */
    --accent-tint: color-mix(in srgb, var(--accent) 10%, var(--paper));  /* 100 档选中底 */
    --accent-wash: color-mix(in srgb, var(--accent) 5%, var(--bg));      /* 050 档 band 底 */
    --ink-tint: color-mix(in srgb, var(--ink) 5%, var(--bg));            /* 极浅墨 band 底 */

    /* —— 语义功能色（底/边/字三件套） —— */
    --ok: var(--accent-4);      --ok-bg: color-mix(in srgb, var(--accent-4) 10%, var(--paper));
    --warn: var(--accent-3);    --warn-bg: color-mix(in srgb, var(--accent-3) 10%, var(--paper));
    --danger: var(--rebel);     --danger-bg: color-mix(in srgb, var(--rebel) 8%, var(--paper));
    --info: var(--accent-2);    --info-bg: color-mix(in srgb, var(--accent-2) 10%, var(--paper));

    /* —— 排版阶梯（1.25 · 0 正文 → 5 hero/KPI） —— */
    --text-step-0: 1rem;       --text-step-1: 1.25rem;    --text-step-2: 1.5625rem;
    --text-step-3: 1.953rem;   --text-step-4: 2.441rem;   --text-step-5: 3.052rem;
    --text-hero: clamp(1.75rem, 1.2rem + 2.5vw, 2.75rem);
    --leading-tight: 1.3;  --leading-heading: 1.4;  --leading-body: 1.75;
}

/* ===== 字体分层（W334：标题宋 / 正文黑 / 数字等宽） ===== */
/* 覆写各页面内联 body serif 栈：正文与 UI 改黑体，标题保留宋体 */
body {
    font-family: var(--font-sans);
}
h1, h2, h3, h4, h5,
.section-title, .card h2, .chart-block h3,
.quick-links h3, .three-layer-card h3 {
    font-family: var(--font-serif);
}

/* ===== Hero 覆写（W334：深棕渐变 → 玄墨纯色） ===== */
/* 旧版 135deg 深棕渐变统一替换为玄墨纯色，高光改淡金 */
.hero {
    background: #221D16;
}
.hero::after {
    background: radial-gradient(circle at 70% 30%, rgba(201, 160, 99, 0.14), transparent 60%);
}

/* ===== 选区与焦点细节 ===== */
::selection {
    background: rgba(200, 70, 58, 0.16);
}

/*
 * system.css — 详解西游记 · 全站组件设计系统
 * ----------------------------------------------
 * v2 · W477 Phase E1（纸感海拔接入 + 交互组件五态 + 微交互工具类 · DESIGN.md §4A）
 * 故宫数字馆藏 × Linear 信息密度
 *
 * 层级关系：
 *   tokens.css  → 设计令牌（变量层）
 *   system.css  → 组件样式（结构层）← 本文件
 *   页面内联    → 仅图表/数据特有样式
 *
 * 引用方式（放在 tokens.css 之后）：
 *   <link rel="stylesheet" href="../system.css">  (data/ 子目录)
 *   <link rel="stylesheet" href="system.css">      (site/ 根)
 */

/* ===== 重置与基础 ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {
    -webkit-tap-highlight-color: rgba(200, 70, 58, 0.12);
    scroll-behavior: smooth;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: var(--leading-body);
    min-height: 100vh;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
    html { scroll-behavior: auto; }
}
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
}
img, svg { display: block; max-width: 100%; }
::selection { background: rgba(200, 70, 58, 0.14); }

/* ===== 排版层级 ===== */
h1, h2, h3, h4, h5 { font-family: var(--font-serif); color: var(--ink); line-height: 1.25; }
h1 { font-size: clamp(36px, 5vw, 56px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: clamp(28px, 3.5vw, 40px); font-weight: 600; }
h3 { font-size: clamp(20px, 2.5vw, 26px); font-weight: 600; }
h4 { font-size: 18px; font-weight: 500; }
.text-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.text-muted { color: var(--ink-soft); }
.text-faint { color: var(--ink-faint); }
.text-accent { color: var(--accent); }
.text-sm { font-size: 13px; }
.text-xs { font-size: 11px; letter-spacing: 0.04em; }
.kicker {
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

/* ===== 布局容器 ===== */
.page-wrap {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 clamp(24px, 6vw, 96px);
}
.section {
    padding: clamp(48px, 7vw, 88px) 0;
}
.section + .section {
    border-top: 1px solid var(--line);
}
.section-head {
    margin-bottom: clamp(28px, 4vw, 48px);
}
.section-head .kicker { margin-bottom: 12px; }
.section-head h2 { margin-bottom: 8px; }
.section-head .note { font-size: 15px; color: var(--ink-soft); max-width: 640px; }

/* ===== 顶部导航 ===== */
.topnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px clamp(24px, 6vw, 96px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 50;
}
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}
.seal {
    width: 40px;
    height: 40px;
    background: var(--accent);
    border-radius: 3px;
    display: grid;
    place-items: center;
    color: #fff;
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 13px;
    line-height: 1.1;
    text-align: center;
    flex-shrink: 0;
}
.wordmark {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
}
.topnav nav {
    display: flex;
    gap: 28px;
    align-items: center;
}
.topnav nav a {
    font-size: 14px;
    color: var(--ink-soft);
    transition: color 0.15s;
    white-space: nowrap;
}
.topnav nav a:hover { color: var(--accent); }
.topnav nav a.active { color: var(--ink); font-weight: 500; }
@media (max-width: 768px) {
    .topnav { padding: 16px 20px; }
    .topnav nav { gap: 16px; }
    .topnav nav a { font-size: 13px; }
    .wordmark { font-size: 16px; }
}

/* ===== Hero（数据页通用） ===== */
.hero {
    background: var(--dark);
    background-image: url('static/images/ink-mountains-hero.webp');
    background-size: cover;
    background-position: center 70%;
    background-blend-mode: soft-light;
    color: var(--dark-text);
    padding: clamp(48px, 8vw, 80px) clamp(24px, 6vw, 96px);
    position: relative;
    overflow: hidden;
}
.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 75% 20%, rgba(201, 160, 99, 0.10), transparent 55%);
    pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
.hero .kicker { color: var(--accent-soft); margin-bottom: 14px; }
.hero h1 {
    color: var(--dark-text);
    font-size: clamp(28px, 4vw, 44px);
    margin-bottom: 10px;
}
.hero .subtitle {
    font-size: 14px;
    color: rgba(242, 235, 220, 0.7);
    letter-spacing: 0.06em;
}
.hero .tagline {
    margin-top: 14px;
    font-size: 13px;
    color: rgba(242, 235, 220, 0.5);
    font-style: italic;
}
/* Hero 内面包屑 */
.hero .breadcrumb {
    margin-bottom: 20px;
    font-size: 12px;
    color: rgba(242, 235, 220, 0.45);
}
.hero .breadcrumb a { color: rgba(242, 235, 220, 0.6); }
.hero .breadcrumb a:hover { color: var(--accent-soft); }

/* ===== 卡片 ===== */
.card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: var(--elev-1);
    padding: clamp(20px, 3vw, 28px);
    transition: border-color var(--dur-base) var(--ease-out-quart),
                transform var(--dur-base) var(--ease-out-quart),
                box-shadow var(--dur-base) var(--ease-out-quart);
}
.card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--elev-2);
}
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}
.card .card-kicker {
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin-bottom: 10px;
}
.card h3 { font-size: 20px; margin-bottom: 8px; }
.card p { font-size: 14px; color: var(--ink-soft); }
.card .card-meta {
    margin-top: 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
}

/* ===== KPI 数字卡 ===== */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
}
.kpi {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: var(--elev-1);
    padding: 20px;
    transition: border-color var(--dur-base) var(--ease-out-quart),
                transform var(--dur-base) var(--ease-out-quart),
                box-shadow var(--dur-base) var(--ease-out-quart);
}
.kpi:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--elev-2);
}
.kpi .kpi-value {
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
}
.kpi .kpi-label {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink-soft);
}
.kpi .kpi-desc {
    margin-top: 4px;
    font-size: 11px;
    color: var(--ink-faint);
}

/* ===== 图表容器 ===== */
.chart-block {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: var(--elev-1);
    padding: clamp(20px, 3vw, 32px);
    margin-bottom: 24px;
}
.chart-block h3 {
    font-size: 18px;
    margin-bottom: 6px;
}
.chart-block .chart-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 20px;
}
.chart-block svg { width: 100%; height: auto; }
/* 图表内 D3 元素统一样式 */
.chart-block .axis text {
    font-family: var(--font-mono);
    font-size: 11px;
    fill: var(--ink-faint);
}
.chart-block .axis line,
.chart-block .axis path {
    stroke: var(--line);
}
.chart-block .grid line {
    stroke: var(--line);
    stroke-opacity: 0.5;
}

/* ===== 表格 ===== */
.table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
}
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}
/* 数据摘要表容器：摘要表 th 使用 white-space:nowrap，列数多时 Intrinsic 宽度
   超过移动端父容器（375px 视口下内容区约 285px），表会横向溢出被截断。
   设为横向滚动容器，使宽表在手机上可滑动查看，同时消除 CI layout 断言的
   table-overflow 告警（direct parent 的 overflow-x 命中 auto 即视为可滚动）。 */
#summary-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
thead {
    background: var(--paper-warm);
}
th {
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    text-align: left;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
}
td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
}
tr:last-child td { border-bottom: none; }
/* —— 墨韵动效（W460）：行 hover 暖纸底 + 左缘朱砂指示条 + 数字列加深 —— */
tbody tr td { transition: background-color var(--dur-fast) var(--ease-out-quart); }
tbody tr:hover td { background: color-mix(in srgb, var(--paper-warm) 60%, transparent); }
tbody tr:hover td:first-child { box-shadow: inset 2px 0 0 0 var(--accent); }
tbody tr:hover td.num { color: var(--accent-3); }
td.num, th.num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
}

/* —— 墨韵动效（W460）：opt-in 行入场 stagger（.table-anim，仅静态表格） —— */
/* --row-i 由页面静态 <tr> 写入；min() 封顶第 12 行起延迟 220ms，总时长 ≤ 470ms */
/* fail-open：calc/min 不支持时整条 animation 声明被丢弃，行直接可见 */
.table-anim tbody tr {
    animation: row-in var(--dur-base) var(--ease-out-quart) both;
    animation-delay: calc(min(var(--row-i, 0), 11) * 20ms);
}
@keyframes row-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
}
/* opt-in sticky 表头（.table-wrap--sticky，仅行数 > 30 的表格） */
.table-wrap--sticky { max-height: 65vh; overflow: auto; }
.table-wrap--sticky thead th { position: sticky; top: 0; background: var(--paper-warm); z-index: 1; }

/* ===== 标签/徽章 ===== */
.badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 3px 10px;
    border-radius: var(--radius-pill);
    border: 1px solid;
}
.badge-accent { color: var(--accent); border-color: rgba(200, 70, 58, 0.25); background: rgba(200, 70, 58, 0.06); }
.badge-blue { color: var(--accent-2); border-color: rgba(58, 107, 140, 0.25); background: rgba(58, 107, 140, 0.06); }
.badge-gold { color: var(--accent-3); border-color: rgba(138, 109, 59, 0.25); background: rgba(138, 109, 59, 0.06); }
.badge-green { color: var(--accent-4); border-color: rgba(107, 142, 90, 0.25); background: rgba(107, 142, 90, 0.06); }

/* —— 墨韵动效（W460）：正文链接下划线生长（opt-in 类 .link-ink，禁止 blanket a） —— */
.link-ink {
    background: linear-gradient(var(--accent), var(--accent)) no-repeat 0 100% / 0% 1px;
    transition: background-size var(--dur-base) var(--ease-out-quart);
}
.link-ink:hover { background-size: 100% 1px; }

/* —— 墨韵动效（W460）：图表 tooltip 全站统一样式（P1 批次逐页采用） —— */
.chart-tooltip {
    position: absolute;
    pointer-events: none;
    z-index: 10;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 8px 12px;
    max-width: 280px;
    font-family: var(--font-sans);
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink);
    box-shadow: var(--elev-3);
    opacity: 0;
    transition: opacity var(--dur-base) var(--ease-out-quart);
}
.chart-tooltip.visible { opacity: 1; }

/* —— 墨韵（W463）：fetch loading 骨架态（仅 fetch 主导页接入·EMBEDDED 同步页不接防闪烁） —— */
.chart-loading {
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--ink-faint);
    font-family: var(--font-sans);
    font-size: 13px;
    background:
        linear-gradient(100deg, transparent 40%, rgba(107, 100, 85, 0.08) 50%, transparent 60%)
        var(--paper-warm);
    background-size: 200% 100%, auto;
    border: 1px solid var(--line);
    border-radius: 3px;
    animation: chart-loading-breath 1.2s var(--ease-in-out-soft) infinite;
}
.chart-loading::before {
    content: "";
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    animation: chart-loading-spin 0.8s linear infinite;
}
@keyframes chart-loading-breath {
    0%, 100% { background-position: 120% 0, 0 0; }
    50% { background-position: -20% 0, 0 0; }
}
@keyframes chart-loading-spin {
    to { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
    .chart-loading { animation: none; }
    .chart-loading::before { animation-duration: 2s; }
}

/* —— 墨韵（W463）：3D/canvas 图表一次性首帧淡入（three 容器/canvas 元素挂载·RM 停帧直接可见） —— */
.chart-fade-in {
    animation: chart-fade-in var(--dur-slow) var(--ease-out-quart) both;
}
@keyframes chart-fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
    .chart-fade-in { animation: none; }
}

/* ===== 按钮 ===== */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;

  function labelOf(n){

  function visibleSet(){
    var vis=new Set();

  function layout(ids, edges){
    var W=900,H=560,cx=W/2,cy=H/2;
    var k=0;
    ids.forEach(function(id){
      if(nodePos.has(id)) return;
      var ang=Math.random()*Math.PI*2;
      var idx=nodePos.size+(k++);
      var a=(Math.PI*2*idx)/Math.max(ids.length,1)-Math.PI/2;
      var R=Math.min(W,H)/2-70;
      nodePos.set(id,{x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)});
    });
    var anchor=new Map();
    ids.forEach(function(id){ var p=nodePos.get(id); anchor.set(id,{x:p.x,y:p.y}); });
    var heavy=ids.length>200;
    var iters=ids.length>60?(heavy?50:90):200;
    if(dragActive) iters=heavy?4:12;  // 拖拽中只做极轻量收敛，保持流畅（零依赖铁律，不引 force-graph）
    var ideal=120;
    for(var it=0;it<iters;it++){
      var fx=new Map(),fy=new Map();
      ids.forEach(function(id){fx.set(id,0);fy.set(id,0);});
      for(var i=0;i<ids.length;i++)for(var j=i+1;j<ids.length;j++){
        var a=nodePos.get(ids[i]),b=nodePos.get(ids[j]);
        var dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy; if(d2<1)d2=1;
        var d=Math.sqrt(d2),rep=6200/d2,ux=dx/d,uy=dy/d;
        fx.set(ids[i],fx.get(ids[i])+rep*ux); fy.set(ids[i],fy.get(ids[i])+rep*uy);
        fx.set(ids[j],fx.get(ids[j])-rep*ux); fy.set(ids[j],fy.get(ids[j])-rep*uy);
      }
      edges.forEach(function(e){
        var a=nodePos.get(e.source),b=nodePos.get(e.target); if(!a||!b)return;
        var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
        var f=(d-ideal)*0.05,ux=dx/d,uy=dy/d;
        fx.set(e.source,fx.get(e.source)+f*ux); fy.set(e.source,fy.get(e.source)+f*uy);
        fx.set(e.target,fx.get(e.target)-f*ux); fy.set(e.target,fy.get(e.target)-f*uy);
      });
      var cool=1-it/iters;
      ids.forEach(function(id){
        var p=nodePos.get(id),an=anchor.get(id);
        fx.set(id,fx.get(id)+(cx-p.x)*0.01+(an.x-p.x)*0.085);
        fy.set(id,fy.get(id)+(cy-p.y)*0.01+(an.y-p.y)*0.085);
        p.x+=Math.max(-18,Math.min(18,fx.get(id)*cool));
        p.y+=Math.max(-18,Math.min(18,fy.get(id)*cool));
        p.x=Math.max(28,Math.min(W-28,p.x)); p.y=Math.max(28,Math.min(H-28,p.y));
      });
    }
    return {W:W,H:H};
  }

    edges.forEach(function(e){

    ids.forEach(function(id){

      svg+='<circle class="gnode" data-id="'+xmlEsc(id)+'" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
      svg+='<text class="gnode" data-id="'+xmlEsc(id)+'" x="'+p.x.toFixed(1)+'" y="'+(p.y-r-5).toFixed(1)+'" fill="#2b2118" font-size="12" text-anchor="middle">'+xmlEsc(lab)+'</text>';
    });
    svg+='</svg>';
    var box=document.getElementById("graphBox"); box.innerHTML=svg;
    // 拖拽/点击统一由 box 容器承接（box 在重渲染间持续存在，避免 SVG 替换丢失监听）
    if(!box._wired){

        var t=ev.target; if(!t||!t.getAttribute||!t.getAttribute("data-id"))return;
        draggingId=t.getAttribute("data-id"); dragMoved=false; dragActive=true;

      box.addEventListener("pointermove",function(ev){

        dragMoved=true; renderGraph();

  }
  function openDrill(id){
    var n=null; GRAPH.nodes.forEach(function(x){ if(x.id===id)n=x; }); if(!n)return;

<script id="audit-axisfix">
(function(){
  function fixAxes(){
    try{
      var svgs = document.querySelectorAll('svg');
      svgs.forEach(function(svg){
        var groups = svg.querySelectorAll('g');
        groups.forEach(function(axisG){
          if(!axisG.querySelector(':scope > .domain')) return;
          var ticks = axisG.querySelectorAll(':scope > g.tick');
          if(ticks.length < 6) return;
          var bottom = false;
          ticks.forEach(function(t){
            var tr = t.getAttribute('transform') || '';
            var m = tr.match(/translate\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/);
            if(m && Math.abs(parseFloat(m[2])) < 0.5) bottom = true;
          });
          if(!bottom) return;
          ticks.forEach(function(t){
            var txt = t.querySelector('text');
            if(!txt) return;
            txt.style.transformBox = 'fill-box';
            txt.style.transformOrigin = 'top center';
            txt.style.transform = 'rotate(-38deg)';
            txt.style.fontSize = '10px';
            txt.style.fontWeight = '500';
          });
        });
      });
    }catch(e){ /* noop */ }
  }
  function run(){ setTimeout(fixAxes, 800); setTimeout(fixAxes, 2600); }
  if(document.readyState === 'complete'){ run(); }
  else { window.addEventListener('load', run); }
})();
</script>

<script id="audit-axisfix2">
(function(){
  function variance(a){var m=a.reduce(function(s,v){return s+v;},0)/a.length;return a.reduce(function(s,v){return s+(v-m)*(v-m);},0)/a.length;}
  function fix(){
    try{
      document.querySelectorAll('svg').forEach(function(svg){
        svg.querySelectorAll('g').forEach(function(g){
          if(!g.querySelector(':scope > .domain')) return;
          var ticks=[].slice.call(g.querySelectorAll(':scope > g.tick'));
          if(ticks.length<5) return;
          var xs=[],ys=[];
          ticks.forEach(function(t){
            var m=(t.getAttribute('transform')||'').match(/translate\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/);
            if(m){xs.push(parseFloat(m[1]));ys.push(parseFloat(m[2]));}
          });
          if(xs.length<3) return;
          var vx=variance(xs), vy=variance(ys);
          if(vx>vy){
            // 水平(底部)轴：旋转 + 缩小
            ticks.forEach(function(t){
              var tx=t.querySelector('text'); if(!tx) return;
              tx.style.transformBox='fill-box';
              tx.style.transformOrigin='top center';
              tx.style.transform='rotate(-40deg)';
              tx.style.fontSize='10px';
              tx.style.fontWeight='500';
            });
          } else {
            // 垂直(左侧)轴：缩小 + 隐藏重叠较小者
            var texts=ticks.map(function(t){return t.querySelector('text');}).filter(Boolean);
            texts.forEach(function(tx){ tx.style.fontSize='9px'; });
            var R=texts.map(function(t){return t.getBoundingClientRect();});
            for(var i=0;i<texts.length;i++){
              for(var j=i+1;j<texts.length;j++){
                var a=R[i],b=R[j];
                if(!a.width||!b.width) continue;
                var ix=Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left));
                var iy=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
                if(ix*iy<=0) continue;
                var area=Math.min(a.width*a.height,b.width*b.height);
                if(area>0 && (ix*iy)/area>0.5){
                  var hide=(a.width*a.height<=(b.width*b.height))?texts[i]:texts[j];
                  if(hide.style.display!=='none') hide.style.display='none';
                }
              }
            }
          }
        });
      });
    }catch(e){ /* noop */ }
  }
  function run(){ setTimeout(fix,800); setTimeout(fix,2600); setTimeout(fix,5000); }
  if(document.readyState==='complete'){ run(); }
  else { window.addEventListener('load', run); }
})();
</script>

<script id="audit-labelavoid-all">

        var ts=[].slice.call(svg.querySelectorAll("text")).filter(function(t){
          // 排除轴刻度、图例、标题、轴标签、热力格子、tooltip
          if(t.closest && t.closest(".tick, .legend, .axis, .domain, .title, .cell, .tooltip, .axis-label")) return false;
          var r=t.getBoundingClientRect(); return r.width>0&&r.height>0;
        });
        var R=ts.map(function(t){return t.getBoundingClientRect();});
        for(var i=0;i<ts.length;i++){
          for(var j=i+1;j<ts.length;j++){
            var a=R[i],b=R[j];
            if(!a.width||!b.width) continue;
            var ix=Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left));
            var iy=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
            if(ix*iy<=0) continue;
            var area=Math.min(a.width*a.height,b.width*b.height);
            if(area>0 && (ix*iy)/area>0.5){
              var hide=(a.width*a.height<=(b.width*b.height))?ts[i]:ts[j];
              if(hide.style.display!=="none"){
                // 加 title 保留全名（hover 可见）
                if(!hide.querySelector(":scope > title")){
                  var ti=document.createElementNS("http://www.w3.org/2000/svg","title");
                  ti.textContent=hide.textContent;
                  hide.appendChild(ti);
                }
                hide.style.display="none";
              }
            }
          }
        }
      });
    }catch(e){ /* noop */ }
  }
  function run(){ [1200,3000,6000,9000,12000].forEach(function(ms){ setTimeout(avoid,ms); }); }
  if(document.readyState==="complete"){ run(); }
  else { window.addEventListener("load", run); }
})();
</script>
<script id="audit-axisfix3">
(function(){
  function variance(a){var m=a.reduce(function(s,v){return s+v;},0)/a.length;return a.reduce(function(s,v){return s+(v-m)*(v-m);},0)/a.length;}
  function fix(){
    try{
      document.querySelectorAll('svg').forEach(function(svg){
        svg.querySelectorAll('g').forEach(function(g){
          var ticks=[].slice.call(g.querySelectorAll(':scope > g.tick'));
          if(ticks.length<5) return;
          var xs=[],ys=[];
          ticks.forEach(function(t){
            var m=(t.getAttribute('transform')||'').match(/translate\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/);
            if(m){xs.push(parseFloat(m[1]));ys.push(parseFloat(m[2]));}
          });
          if(xs.length<3) return;
          var vx=variance(xs), vy=variance(ys);
          if(vx>vy){
            ticks.forEach(function(t){
              var tx=t.querySelector('text'); if(!tx) return;
              tx.style.transformBox='fill-box';
              tx.style.transformOrigin='top center';
              tx.style.transform='rotate(-40deg)';
              tx.style.fontSize='10px';
              tx.style.fontWeight='500';
            });
          } else {
            var texts=ticks.map(function(t){return t.querySelector('text');}).filter(Boolean);
            texts.forEach(function(tx){ tx.style.fontSize='9px'; });
            var R=texts.map(function(t){return t.getBoundingClientRect();});
            for(var i=0;i<texts.length;i++){
              for(var j=i+1;j<texts.length;j++){
                var a=R[i],b=R[j];
                if(!a.width||!b.width) continue;
                var ix=Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left));
                var iy=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
                if(ix*iy<=0) continue;
                var area=Math.min(a.width*a.height,b.width*b.height);
                if(area>0 && (ix*iy)/area>0.5){
                  var hide=(a.width*a.height<=(b.width*b.height))?texts[i]:texts[j];
                  if(hide.style.display!=='none') hide.style.display='none';
                }
              }
            }
          }
        });
      });
    }catch(e){ /* noop */ }
  }
  function run(){ setTimeout(fix,800); setTimeout(fix,2600); setTimeout(fix,5000); }
  if(document.readyState==='complete'){ run(); }
  else { window.addEventListener('load', run); }
})();
</script>

<script id="audit-axisfix4">
(function(){
  var NUM=/^(第?\d+回?|\d+(\.\d+)?|\d+%?|W\d+)$/;
  function bbox(t){return t.getBoundingClientRect();}
  function fix(){
    try{
      document.querySelectorAll('svg').forEach(function(svg){
        var all=[].slice.call(svg.querySelectorAll('text')).filter(function(t){var r=bbox(t);return r.width>0&&r.height>0;});
        var nums=all.filter(function(t){return NUM.test((t.textContent||'').trim());});
        var axisNum=new Set();
        var rows={},cols={};
        nums.forEach(function(t){var r=bbox(t);var y=Math.round(r.top/8)*8;rows[y]=rows[y]||[];rows[y].push(t);var x=Math.round(r.left/8)*8;cols[x]=cols[x]||[];cols[x].push(t);});
        Object.keys(rows).forEach(function(k){if(rows[k].length>=3)rows[k].forEach(function(t){axisNum.add(t);});});
        Object.keys(cols).forEach(function(k){if(cols[k].length>=3)cols[k].forEach(function(t){axisNum.add(t);});});
        axisNum.forEach(function(t){t.style.fontSize='9px';t.style.fontWeight='500';});
        for(var i=0;i<all.length;i++){
          for(var j=i+1;j<all.length;j++){
            var a=all[i],b=all[j];
            var ra=bbox(a),rb=bbox(b);
            var ix=Math.max(0,Math.min(ra.right,rb.right)-Math.max(ra.left,rb.left));
            var iy=Math.max(0,Math.min(ra.bottom,rb.bottom)-Math.max(ra.top,rb.top));
            var inter=ix*iy; if(inter<=0) continue;
            var area=Math.min(ra.width*ra.height,rb.width*rb.height);
            if(area<=0||inter/area<0.4) continue;
            var ta=(a.textContent||'').trim(),tb=(b.textContent||'').trim();
            var dup=ta&&ta===tb;
            var aAxis=axisNum.has(a),bAxis=axisNum.has(b);
            var aNum=NUM.test(ta),bNum=NUM.test(tb);
            var act=false;
            if(dup)act=true; else if(aAxis||bAxis)act=true; else if(aNum&&bNum)act=true;
            if(!act) continue;
            var hide,keep;
            if(dup){ hide=(ta.length<=tb.length)?a:b; keep=(hide===a)?b:a; }
            else { hide=(ra.width*ra.height<=rb.width*rb.height)?a:b; keep=(hide===a)?b:a; }
            if(hide.style.display!=='none'){
              hide.setAttribute('data-axisfix4','1');
              if(!hide.getAttribute('title')) hide.setAttribute('title',(hide.textContent||'').trim());
              hide.style.display='none';
            }
          }
        }
      });
    }catch(e){}
  }
  function run(){[800,2600,5000,8000,11000].forEach(function(t){setTimeout(fix,t);});}
  if(document.readyState==='complete')run();else window.addEventListener('load',run);
})();
</script>

<script>
// 墨韵（W463）：fetch loading 骨架自移除——目标容器出现内容后移除；8s 超时兜底（防永久骨架·fail-open）
(function () {
    var els = Array.prototype.slice.call(document.querySelectorAll('.chart-loading'));
    if (!els.length) return;
    function rm(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }
    els.forEach(function (el) {
        try {
            var host = el.parentElement;
            if (!host) { rm(el); return; }
            var next = el.nextElementSibling;
            var watchSvg = next && next.tagName === 'svg' ? next : null;
            function done() {
                return watchSvg
                    ? watchSvg.childElementCount > 0
                    : Array.prototype.some.call(host.children, function (c) { return c !== el; });
            }
            if (done()) { rm(el); return; }  /* 初始已渲染（microtask 先于本脚本）直接移除 */
            var mo = new MutationObserver(function () {
                if (done()) { mo.disconnect(); rm(el); }
            });
            mo.observe(watchSvg || host, { childList: true });
        } catch (_) { rm(el); }
    });
    setTimeout(function () { els.forEach(rm); }, 8000);
})();
</script>
