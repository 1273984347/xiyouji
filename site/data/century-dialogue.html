        /* 三方会谈舞台 */
        .triangle-stage { position: relative; height: 480px; background: linear-gradient(160deg, #1a1410, #3a2820);
                          border-radius: 10px; padding: 30px; overflow: hidden; }
        .speech-bubble { position: absolute; background: var(--paper); border: 2px solid var(--accent);
                         border-radius: 12px; padding: 16px; max-width: 280px; box-shadow: var(--shadow);
                         opacity: 0; animation: fadeInUp 0.8s ease forwards; }
        .speech-bubble:nth-child(1) { animation-delay: 0.2s; }
        .speech-bubble:nth-child(2) { animation-delay: 1.2s; }
        .speech-bubble:nth-child(3) { animation-delay: 2.2s; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .speech-bubble .speaker { font-weight: 600; color: var(--accent); margin-bottom: 4px; }
        .speech-bubble .position { font-size: 0.75rem; color: var(--ink-soft); margin-bottom: 8px; }
        .speech-bubble .argument { font-size: 0.88rem; line-height: 1.6; }
        .speech-bubble .quote { font-size: 0.82rem; color: var(--accent-3); font-style: italic; margin-top: 8px; }

        /* 角色圆桌 */
        .roundtable { position: relative; height: 500px; background: var(--paper); border: 1px solid var(--line);
                      border-radius: 10px; padding: 30px; }
        .bajie-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                        width: 120px; height: 120px; border-radius: 50%; background: var(--accent-soft);
                        display: flex; align-items: center; justify-content: center; font-size: 3rem; }
        .roundtable-view { position: absolute; width: 180px; background: #fff8ec; border: 1px solid var(--line);
                           border-radius: 8px; padding: 12px; transition: transform 0.2s; }
        .roundtable-view:hover { transform: scale(1.05); border-color: var(--accent); }
        .roundtable-view .speaker { font-weight: 600; color: var(--accent); font-size: 0.9rem; }
        .roundtable-view .view { font-size: 0.82rem; color: var(--ink); margin-top: 4px; }

        @media (max-width: 768px) {
            .triangle-stage { height: auto; min-height: 600px; }
            .speech-bubble { position: relative; top: auto !important; left: auto !important; right: auto !important;
                             max-width: 100%; margin-bottom: 16px; }
            .roundtable { height: auto; min-height: 700px; }
            .bajie-center { position: relative; top: auto; left: auto; transform: none; margin: 0 auto 20px; }
            .roundtable-view { position: relative; left: auto !important; top: auto !important; margin: 12px auto; }
        }

<script>
const EMBEDDED_DATA = {
    triangle_dialogue: [
        { speaker: "李卓吾", position: "释厄密码", argument: "《西游记》表面写取经降妖，实则写心性修行。「释厄」二字是全书密码——解脱苦难即是修心。九九八十一难，每一难都是心魔的外化。",
          quote: "读《西游记》者，不知作者宗旨，定作戏论。", era: "明代" },
        { speaker: "胡适", position: "滑稽神话", argument: "《西游记》至多不过是一部很有趣味的滑稽小说，并没有什么微妙的意思。不必过度解读，好玩本身就是价值。",
          quote: "至多不过是一部很有趣味的滑稽小说……并没有什么微妙的意思", era: "民国" },
        { speaker: "毛泽东", position: "被压迫者反抗战歌", argument: "孙悟空大闹天宫是被压迫者反抗统治阶级的战歌。唐僧百折不回、悟空反权威、八戒艰苦奋斗——取经团队就是革命队伍的缩影。",
          quote: "唐僧百折不回·悟空反权威·八戒艰苦奋斗·白龙马任劳任怨", era: "现代" }
    ],
    roundtable_topics: [
        { topic: "如何评价猪八戒",
          participants: ["鲁迅", "林语堂", "毛泽东"],
          views: [
              { speaker: "鲁迅", view: "人情味——八戒身上的贪吃好色正是神魔皆有人情的最好注脚" },
              { speaker: "林语堂", view: "人欲原型——八戒是荣格心理学中的阴影原型，真实打工人的缩影" },
              { speaker: "毛泽东", view: "艰苦奋斗务实——八戒虽有缺点但始终走完取经路，是务实打工人的典范" }
          ] }
    ]
};

// triangleData 参数：fetch 成功时传 data.triangle，失败时传 EMBEDDED_DATA.triangle_dialogue
function renderTriangle(triangleData) {
    const stage = d3.select("#triangle-stage");
    stage.selectAll("*").remove();
    if (!triangleData || triangleData.length === 0) {
        stage.append("div").text("暂无三方会谈数据")
             .style("color", "var(--ink-soft)").style("text-align", "center")
             .style("padding", "60px 20px");
        return;
    }
    // positions 顺序必须与 triangle_dialogue 数组顺序一致：[李卓吾, 胡适, 毛泽东]
    const positions = [
        { top: "10%", left: "5%", right: null },   // 李卓吾 左上
        { top: "10%", left: null, right: "5%" },   // 胡适 右上
        { top: "55%", left: "35%", right: null }    // 毛泽东 中下
    ];
    const bubbles = stage.selectAll(".speech-bubble").data(triangleData).enter()
        .append("div").attr("class", "speech-bubble")
        .style("top", (d, i) => positions[i].top)
        .each(function(d, i) {
            // D3 v7 selection.style(name, value) 要求 name 是 string，不能用函数
            const pos = positions[i];
            if (pos.left !== null) d3.select(this).style("left", pos.left);
            if (pos.right !== null) d3.select(this).style("right", pos.right);
        });
    bubbles.append("div").attr("class", "speaker").text(d => d.speaker);
    bubbles.append("div").attr("class", "position").text(d => d.position);
    bubbles.append("div").attr("class", "argument").text(d => d.argument);
    bubbles.append("div").attr("class", "quote").text(d => "「" + d.quote + "」");
}

// roundtableData 参数：fetch 成功时传 data.roundtable，失败时传 EMBEDDED_DATA.roundtable_topics
function renderRoundtable(roundtableData, topicIndex = 0) {
    const rt = d3.select("#roundtable");
    rt.selectAll("*").remove();
    // 空数据保护
    const topic = roundtableData && roundtableData[topicIndex];
    if (!topic || !topic.views || topic.views.length === 0) {
        rt.append("div").text("暂无圆桌讨论数据")
          .style("color", "var(--ink-soft)").style("text-align", "center")
          .style("padding", "60px 20px");
        return;
    }
    rt.append("div").attr("class", "bajie-center").text("🐷");
    // 3 观点环绕（120 度均分，center 基于容器实际宽度动态计算，与 .bajie-center left:50% 对齐）
    const radius = 180;
    const containerWidth = Math.max(200, rt.node().clientWidth || 500);
    const containerHeight = rt.node().clientHeight || 500;
    const center = { x: containerWidth / 2, y: containerHeight / 2 };
    topic.views.forEach((v, i) => {
        const angle = (i * 120 - 90) * Math.PI / 180;
        const x = center.x + radius * Math.cos(angle);
        const y = center.y + radius * Math.sin(angle);
        // D3 v7 .style(name, value) 的 name 必须是 string；此处 left/top 需条件计算，用 .each() pattern
        rt.append("div").attr("class", "roundtable-view")
          .each(function() {
              d3.select(this).style("left", x + "px").style("top", y + "px");
          })
          .each(function() {
              const viewDiv = d3.select(this);
              viewDiv.append("div").attr("class", "speaker").text(v.speaker);
              viewDiv.append("div").attr("class", "view").text(v.view);
          });
    });
}

const fetchStatus = { anyFetched: false };
async function fetchJson(path, fallbackKey) {
    try {
        const response = await fetch(path);
        if (!response.ok) throw new Error('fetch failed: ' + path);
        fetchStatus.anyFetched = true;
        return await response.json();
    } catch (e) {
        console.warn('[INFO] 使用嵌入数据 (' + fallbackKey + ')：', e.message);
        return EMBEDDED_DATA[fallbackKey];
    }
}
async function loadData() {
    const base = '../../scripts/output/data/';
    const [triangle, roundtable] = await Promise.all([
        fetchJson(base + 'v08_triangle_dialogue.json', 'triangle_dialogue'),
        fetchJson(base + 'v08_roundtable.json', 'roundtable_topics')
    ]);
    return { triangle, roundtable };
}
async function main() {
    const data = await loadData();
    window.__lastData = data;
    if (fetchStatus.anyFetched) {
        document.getElementById('dataSource').innerHTML =
            '数据源：实时加载自 <code>scripts/output/data/</code>（运行于 http server 模式）';
    }
    renderTriangle(data.triangle);
    renderRoundtable(data.roundtable, 0);
}
let resizeTimer;
window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        if (window.__lastData) {
            renderTriangle(window.__lastData.triangle);
            renderRoundtable(window.__lastData.roundtable, 0);
        }
    }, 250);
});
main();
</script>
