<html lang="zh-CN">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- INLINED CSS (tokens.css + system.css) · 单一事实源: site/tokens.css, site/system.css · 重同步: python scripts/inline_css.py -->
    <style>
/*
 * tokens.css — 西游记可视化站点公共设计令牌
 * ----------------------------------------------
 * v2 · W334 新中式·数字雅集（2026-08-02）
 * 全站统一设计令牌 + 字体分层 + hero 覆写层。
 *
 * 引用方式（必须放在页面内联 <style> 之后，确保级联覆盖）：
 *   <link rel="stylesheet" href="../tokens.css">  (data/ 子目录页面)
 *   <link rel="stylesheet" href="tokens.css">      (site/ 根页面)
 *
 * 设计原则：
 *   - 宣纸暖白为底、墨褐为骨，朱砂为唯一彩色强调
 *   - 标题宋体 / 正文黑体 / 数字等宽，三层字体分工
 *   - 0-2px 圆角、无厚重阴影、1px 发丝线分隔、大留白
 *   - 图表五色雅集色板：朱砂/靛蓝/赭金/苔绿/米灰（+ 赭石备用）
 */

/* ===== 子集化 webfont（W334 · 本地托管 · file:// 可用 · 零外部依赖） ===== */
/* 字体文件位于 site/static/fonts/，由 scripts/w334_font_subset.py 生成（~3,700 字） */
/* 思源宋体为可变字重（wght 200-900），标题/正文按需取重 */
@font-face {
    font-family: 'Noto Serif SC';
    font-style: normal;
    font-weight: 200 900;
    font-display: swap;
    src: url('static/fonts/NotoSerifSC-VF.woff2') format('woff2-variations');
}
@font-face {
    font-family: 'Noto Sans SC';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('static/fonts/NotoSansSC-Regular.woff2') format('woff2');
}
@font-face {
    font-family: 'Noto Sans SC';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('static/fonts/NotoSansSC-Medium.woff2') format('woff2');
}
@font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('static/fonts/JetBrainsMono-Regular.woff2') format('woff2');
}
@font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('static/fonts/JetBrainsMono-Medium.woff2') format('woff2');
}

:root {
    color-scheme: light;

    /* —— 背景 / 纸张 —— */
    --bg: #FAF7F0;            /* 页面整体背景：宣纸暖白 */
    --paper: #FFFFFF;         /* 卡片 / section 内容区背景 */
    --paper-warm: #F1EBDD;    /* 暖调浅底：注条 / 徽band底 */
    --dark: #221D16;          /* 玄墨深色区块（开篇诗 / 深色节奏段） */
    --dark-text: #F2EBDC;     /* 深色区块上的文字 */

    /* —— 文字 —— */
    --ink: #23201A;           /* 主文字：墨 */
    --ink-soft: #6B6455;      /* 次级文字：浅墨 */
    --ink-faint: #9A9280;     /* 三级文字：淡墨（meta / 编号） */

    /* —— 主辅配色（朱砂单点强调） —— */
    --accent: #C8463A;        /* 主强调色：朱砂红（全站唯一彩色强调） */
    --accent-soft: #E9B885;   /* 浅赭金：徽章底 / 渐变高光 */
    --accent-2: #3A6B8C;      /* 靛蓝：链接 / 数据 meta / 第二系列 */
    --accent-3: #8A6D3B;      /* 赭石：提示文字 / 第三系列 */
    --accent-4: #6B8E5A;      /* 苔绿：正向数据 / 第四系列 */
    --rebel: #8C2A2A;         /* 反派 / 警示色：暗朱红 */

    /* —— 图表五色雅集色板（W334 图表规范） —— */
    --chart-1: #C8463A;       /* 朱砂 */
    --chart-2: #3A6B8C;       /* 靛蓝 */
    --chart-3: #C9A063;       /* 赭金 */
    --chart-4: #6B8E5A;       /* 苔绿 */
    --chart-5: #D8CFBC;       /* 米灰 */
    --chart-6: #8A6D3B;       /* 赭石（备用第 6 系列） */

    /* —— 分隔线 —— */
    --line: #E5DFD0;          /* 发丝线：浅米褐 */

    /* —— 阴影（克制，仅卡片浮起用） —— */
    --shadow: 0 1px 3px rgba(35, 32, 26, 0.06), 0 4px 12px rgba(35, 32, 26, 0.05);

    /* —— 字体三层分工 —— */
    --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', serif;
    --font-sans: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
}

/* ===== 字体分层（W334：标题宋 / 正文黑 / 数字等宽） ===== */
/* 覆写各页面内联 body serif 栈：正文与 UI 改黑体，标题保留宋体 */
body {
    font-family: var(--font-sans);
}
h1, h2, h3, h4, h5,
.section-title, .card h2, .chart-block h3,
.quick-links h3, .three-layer-card h3 {
    font-family: var(--font-serif);
}

/* ===== Hero 覆写（W334：深棕渐变 → 玄墨纯色） ===== */
/* 旧版 135deg 深棕渐变统一替换为玄墨纯色，高光改淡金 */
.hero {
    background: #221D16;
}
.hero::after {
    background: radial-gradient(circle at 70% 30%, rgba(201, 160, 99, 0.14), transparent 60%);
}

/* ===== 选区与焦点细节 ===== */
::selection {
    background: rgba(200, 70, 58, 0.16);
}

/*
 * system.css — 详解西游记 · 全站组件设计系统
 * ----------------------------------------------
 * 故宫数字馆藏 × Linear 信息密度
 *
 * 层级关系：
 *   tokens.css  → 设计令牌（变量层）
 *   system.css  → 组件样式（结构层）← 本文件
 *   页面内联    → 仅图表/数据特有样式
 *
 * 引用方式（放在 tokens.css 之后）：
 *   <link rel="stylesheet" href="../system.css">  (data/ 子目录)
 *   <link rel="stylesheet" href="system.css">      (site/ 根)
 */

/* ===== 重置与基础 ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {
    -webkit-tap-highlight-color: rgba(200, 70, 58, 0.12);
    scroll-behavior: smooth;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
    html { scroll-behavior: auto; }
}
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
}
img, svg { display: block; max-width: 100%; }
::selection { background: rgba(200, 70, 58, 0.14); }

/* ===== 排版层级 ===== */
h1, h2, h3, h4, h5 { font-family: var(--font-serif); color: var(--ink); line-height: 1.25; }
h1 { font-size: clamp(36px, 5vw, 56px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: clamp(28px, 3.5vw, 40px); font-weight: 600; }
h3 { font-size: clamp(20px, 2.5vw, 26px); font-weight: 600; }
h4 { font-size: 18px; font-weight: 500; }
.text-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.text-muted { color: var(--ink-soft); }
.text-faint { color: var(--ink-faint); }
.text-accent { color: var(--accent); }
.text-sm { font-size: 13px; }
.text-xs { font-size: 11px; letter-spacing: 0.04em; }
.kicker {
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

/* ===== 布局容器 ===== */
.page-wrap {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 clamp(24px, 6vw, 96px);
}
.section {
    padding: clamp(48px, 7vw, 88px) 0;
}
.section + .section {
    border-top: 1px solid var(--line);
}
.section-head {
    margin-bottom: clamp(28px, 4vw, 48px);
}
.section-head .kicker { margin-bottom: 12px; }
.section-head h2 { margin-bottom: 8px; }
.section-head .note { font-size: 15px; color: var(--ink-soft); max-width: 640px; }

/* ===== 顶部导航 ===== */
.topnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px clamp(24px, 6vw, 96px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(250, 247, 240, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 50;
}
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}
.seal {
    width: 40px;
    height: 40px;
    background: var(--accent);
    border-radius: 3px;
    display: grid;
    place-items: center;
    color: #fff;
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 13px;
    line-height: 1.1;
    text-align: center;
    flex-shrink: 0;
}
.wordmark {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
}
.topnav nav {
    display: flex;
    gap: 28px;
    align-items: center;
}
.topnav nav a {
    font-size: 14px;
    color: var(--ink-soft);
    transition: color 0.15s;
    white-space: nowrap;
}
.topnav nav a:hover { color: var(--accent); }
.topnav nav a.active { color: var(--ink); font-weight: 500; }
@media (max-width: 768px) {
    .topnav { padding: 16px 20px; }
    .topnav nav { gap: 16px; }
    .topnav nav a { font-size: 13px; }
    .wordmark { font-size: 16px; }
}

/* ===== Hero（数据页通用） ===== */
.hero {
    background: var(--dark);
    background-image: url('static/images/ink-mountains-hero.webp');
    background-size: cover;
    background-position: center 70%;
    background-blend-mode: soft-light;
    color: var(--dark-text);
    padding: clamp(48px, 8vw, 80px) clamp(24px, 6vw, 96px);
    position: relative;
    overflow: hidden;
}
.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 75% 20%, rgba(201, 160, 99, 0.10), transparent 55%);
    pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
.hero .kicker { color: var(--accent-soft); margin-bottom: 14px; }
.hero h1 {
    color: var(--dark-text);
    font-size: clamp(28px, 4vw, 44px);
    margin-bottom: 10px;
}
.hero .subtitle {
    font-size: 14px;
    color: rgba(242, 235, 220, 0.7);
    letter-spacing: 0.06em;
}
.hero .tagline {
    margin-top: 14px;
    font-size: 13px;
    color: rgba(242, 235, 220, 0.5);
    font-style: italic;
}
/* Hero 内面包屑 */
.hero .breadcrumb {
    margin-bottom: 20px;
    font-size: 12px;
    color: rgba(242, 235, 220, 0.45);
}
.hero .breadcrumb a { color: rgba(242, 235, 220, 0.6); }
.hero .breadcrumb a:hover { color: var(--accent-soft); }

/* ===== 卡片 ===== */
.card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: clamp(20px, 3vw, 28px);
    transition: border-color 0.2s, transform 0.2s;
}
.card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
}
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}
.card .card-kicker {
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin-bottom: 10px;
}
.card h3 { font-size: 20px; margin-bottom: 8px; }
.card p { font-size: 14px; color: var(--ink-soft); }
.card .card-meta {
    margin-top: 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
}

/* ===== KPI 数字卡 ===== */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
}
.kpi {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 20px;
    transition: border-color 0.2s;
}
.kpi:hover { border-color: var(--accent); }
.kpi .kpi-value {
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
}
.kpi .kpi-label {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink-soft);
}
.kpi .kpi-desc {
    margin-top: 4px;
    font-size: 11px;
    color: var(--ink-faint);
}

/* ===== 图表容器 ===== */
.chart-block {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: clamp(20px, 3vw, 32px);
    margin-bottom: 24px;
}
.chart-block h3 {
    font-size: 18px;
    margin-bottom: 6px;
}
.chart-block .chart-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 20px;
}
.chart-block svg { width: 100%; height: auto; }
/* 图表内 D3 元素统一样式 */
.chart-block .axis text {
    font-family: var(--font-mono);
    font-size: 11px;
    fill: var(--ink-faint);
}
.chart-block .axis line,
.chart-block .axis path {
    stroke: var(--line);
}
.chart-block .grid line {
    stroke: var(--line);
    stroke-opacity: 0.5;
}

/* ===== 表格 ===== */
.table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line);
    border-radius: 3px;
}
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}
/* 数据摘要表容器：摘要表 th 使用 white-space:nowrap，列数多时 Intrinsic 宽度
   超过移动端父容器（375px 视口下内容区约 285px），表会横向溢出被截断。
   设为横向滚动容器，使宽表在手机上可滑动查看，同时消除 CI layout 断言的
   table-overflow 告警（direct parent 的 overflow-x 命中 auto 即视为可滚动）。 */
#summary-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
thead {
    background: var(--paper-warm);
}
th {
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    text-align: left;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
}
td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255, 255, 255, 0.5); }
td.num, th.num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
}

/* ===== 标签/徽章 ===== */
.badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 3px 10px;
    border-radius: 2px;
    border: 1px solid;
}
.badge-accent { color: var(--accent); border-color: rgba(200, 70, 58, 0.25); background: rgba(200, 70, 58, 0.06); }
.badge-blue { color: var(--accent-2); border-color: rgba(58, 107, 140, 0.25); background: rgba(58, 107, 140, 0.06); }
.badge-gold { color: var(--accent-3); border-color: rgba(138, 109, 59, 0.25); background: rgba(138, 109, 59, 0.06); }
.badge-green { color: var(--accent-4); border-color: rgba(107, 142, 90, 0.25); background: rgba(107, 142, 90, 0.06); }

/* ===== 按钮 ===== */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
}
.btn-primary:hover { background: #b33d32; }

/* ===== 页脚 ===== */
.site-footer {
    border-top: 1px solid var(--line);
    padding: 40px clamp(24px, 6vw, 96px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
}
.site-footer .footer-brand {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
}
.site-footer .footer-meta {
    font-size: 12px;
    color: var(--ink-faint);
}
.site-footer nav {
    display: flex;
    gap: 20px;
}
.site-footer nav a {
    font-size: 13px;
    color: var(--ink-soft);
}
.site-footer nav a:hover { color: var(--accent); }

/* ===== 深色节奏段（引文/分隔） ===== */
.dark-band {
    background: var(--dark);
    color: var(--dark-text);
    padding: clamp(56px, 8vw, 96px) clamp(24px, 6vw, 160px);
    text-align: center;
}
.dark-band .rule {
    width: 40px;
    height: 2px;
    background: var(--accent);
    margin: 0 auto 24px;
}
.dark-band blockquote {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: clamp(18px, 2.4vw, 26px);
    line-height: 1.9;
}
.dark-band .attr {
    margin-top: 20px;
    font-size: 12px;
    color: rgba(242, 235, 220, 0.5);
    letter-spacing: 0.08em;
}

/* ===== 档案索引表（首页九卷） ===== */
.index-table { width: 100%; }
.index-row {
    display: grid;
    grid-template-columns: 32px 220px 1fr auto;
    gap: 20px;
    align-items: center;
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
    transition: background 0.15s;
}
.index-row:hover { background: rgba(255, 255, 255, 0.6); }
.index-row .no {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-faint);
}
.index-row .name {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 18px;
}
.index-row .desc { font-size: 14px; color: var(--ink-soft); }
.index-row .meta {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent-2);
    text-align: right;
    white-space: nowrap;
}
@media (max-width: 768px) {
    .index-row {
        grid-template-columns: 1fr auto;
        gap: 8px;
    }
    .index-row .no { display: none; }
    .index-row .desc { grid-column: 1 / -1; }
}

/* ===== 筛选 Tab ===== */
.filter-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}
.filter-tab {
    font-size: 13px;
    font-weight: 500;
    padding: 7px 16px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s;
}
.filter-tab:hover { border-color: var(--accent); color: var(--accent); }
.filter-tab[aria-pressed="true"],
.filter-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
}

/* ===== 搜索框 ===== */
.search-box {
    position: relative;
    max-width: 400px;
}
.search-box input {
    width: 100%;
    font-size: 14px;
    padding: 10px 16px 10px 40px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);

}
.search-box input:focus {

    content: "搜";

    left: 14px;
    top: 50%;
    transform: translateY(-50%);

    async function fetchJson(path, key) {
        try { const r = await fetch(path); return await r.json(); }
        catch (e) { console.warn('[INFO] 使用嵌入数据：', e.message); return EMBEDDED_DATA[key]; }
    }
    // 空数据保护
    function guardEmpty(data, container) {
        if (!data || data.length === 0) {
            container.append('div').attr('class', 'empty-state')
                .html('<div class="empty-icon">∅</div><p>暂无数据</p>');
            return false;
        }
        return true;
    }

<script id="audit-axisfix">
(function(){
  function fixAxes(){
    try{
      var svgs = document.querySelectorAll('svg');
      svgs.forEach(function(svg){
        var groups = svg.querySelectorAll('g');
        groups.forEach(function(axisG){
          if(!axisG.querySelector(':scope > .domain')) return;
          var ticks = axisG.querySelectorAll(':scope > g.tick');
          if(ticks.length < 6) return;
          var bottom = false;
          ticks.forEach(function(t){
            var tr = t.getAttribute('transform') || '';
            var m = tr.match(/translate\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/);
            if(m && Math.abs(parseFloat(m[2])) < 0.5) bottom = true;
          });
          if(!bottom) return;
          ticks.forEach(function(t){
            var txt = t.querySelector('text');
            if(!txt) return;
            txt.style.transformBox = 'fill-box';
            txt.style.transformOrigin = 'top center';
            txt.style.transform = 'rotate(-38deg)';
            txt.style.fontSize = '10px';
            txt.style.fontWeight = '500';
          });
        });
      });
    }catch(e){ /* noop */ }
  }
  function run(){ setTimeout(fixAxes, 800); setTimeout(fixAxes, 2600); }
  if(document.readyState === 'complete'){ run(); }
  else { window.addEventListener('load', run); }
})();
</script>
