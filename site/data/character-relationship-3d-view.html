/*
 * tokens.css — 西游记可视化站点公共设计令牌
 * ----------------------------------------------
 * v2 · W334 新中式·数字雅集（2026-08-02）
 * 全站统一设计令牌 + 字体分层 + hero 覆写层。
 *
 * 引用方式（必须放在页面内联 <style> 之后，确保级联覆盖）：
 *   <link rel="stylesheet" href="../tokens.css">  (data/ 子目录页面)
 *   <link rel="stylesheet" href="tokens.css">      (site/ 根页面)
 *
 * 设计原则：
 *   - 宣纸暖白为底、墨褐为骨，朱砂为唯一彩色强调
 *   - 标题宋体 / 正文黑体 / 数字等宽，三层字体分工
 *   - 0-2px 圆角、无厚重阴影、1px 发丝线分隔、大留白
 *   - 图表五色雅集色板：朱砂/靛蓝/赭金/苔绿/米灰（+ 赭石备用）
 */

/* ===== 子集化 webfont（W334 · 本地托管 · file:// 可用 · 零外部依赖） ===== */
/* 字体文件位于 site/static/fonts/，由 scripts/w334_font_subset.py 生成（~3,700 字） */
/* 思源宋体为可变字重（wght 200-900），标题/正文按需取重 */
@font-face {
    font-family: 'Noto Serif SC';
    font-style: normal;
    font-weight: 200 900;
    font-display: optional;
    src: url('../static/fonts/noto-serif-sc-shared.woff2' format('woff2-variations');
}
@font-face {
    font-family: 'Noto Sans SC';
    font-style: normal;
    font-weight: 400;
    font-display: optional;
    src: url('../static/fonts/NotoSansSC-Regular.woff2') format('woff2');
}
@font-face {
    font-family: 'Noto Sans SC';
    font-style: normal;
    font-weight: 500;
    font-display: optional;
    src: url('../static/fonts/NotoSansSC-Medium.woff2') format('woff2');
}
@font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('../static/fonts/JetBrainsMono-Regular.woff2') format('woff2');
}
@font-face {
    font-family: 'JetBrains Mono';
    font-style: normal;
    font-weight: 500;
    font-display: swap;
    src: url('../static/fonts/JetBrainsMono-Medium.woff2') format('woff2');
}

:root {
    color-scheme: light;

    /* —— 背景 / 纸张 —— */
    --bg: #FAF7F0;            /* 页面整体背景：宣纸暖白 */
    --paper: #FFFFFF;         /* 卡片 / section 内容区背景 */
    --paper-warm: #F1EBDD;    /* 暖调浅底：注条 / 徽band底 */
    --dark: #221D16;          /* 玄墨深色区块（开篇诗 / 深色节奏段） */
    --dark-text: #F2EBDC;     /* 深色区块上的文字 */

    /* —— 文字 —— */
    --ink: #23201A;           /* 主文字：墨 */
    --ink-soft: #6B6455;      /* 次级文字：浅墨 */
    --ink-faint: #9A9280;     /* 三级文字：淡墨（meta / 编号） */

    /* —— 主辅配色（朱砂单点强调） —— */
    --accent: #C8463A;        /* 主强调色：朱砂红（全站唯一彩色强调） */
    --accent-soft: #E9B885;   /* 浅赭金：徽章底 / 渐变高光 */
    --accent-2: #3A6B8C;      /* 靛蓝：链接 / 数据 meta / 第二系列 */
    --accent-3: #8A6D3B;      /* 赭石：提示文字 / 第三系列 */
    --accent-4: #6B8E5A;      /* 苔绿：正向数据 / 第四系列 */
    --rebel: #8C2A2A;         /* 反派 / 警示色：暗朱红 */

    /* —— 图表五色雅集色板（W334 图表规范） —— */
    --chart-1: #C8463A;       /* 朱砂 */
    --chart-2: #3A6B8C;       /* 靛蓝 */
    --chart-3: #C9A063;       /* 赭金 */
    --chart-4: #6B8E5A;       /* 苔绿 */
    --chart-5: #D8CFBC;       /* 米灰 */
    --chart-6: #8A6D3B;       /* 赭石（备用第 6 系列） */

    /* —— 分隔线 —— */
    --line: #E5DFD0;          /* 发丝线：浅米褐 */

    /* —— 阴影（克制，仅卡片浮起用） —— */
    --shadow: 0 1px 3px rgba(35, 32, 26, 0.06), 0 4px 12px rgba(35, 32, 26, 0.05);

    /* —— 字体三层分工 —— */
    --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', serif;
    --font-sans: 'Noto Sans SC', 'Source Han Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
}

/* ===== 字体分层（W334：标题宋 / 正文黑 / 数字等宽） ===== */
/* 覆写各页面内联 body serif 栈：正文与 UI 改黑体，标题保留宋体 */
body {
    font-family: var(--font-sans);
}
h1, h2, h3, h4, h5,
.section-title, .card h2, .chart-block h3,
.quick-links h3, .three-layer-card h3 {
    font-family: var(--font-serif);
}

/* ===== Hero 覆写（W334：深棕渐变 → 玄墨纯色） ===== */
/* 旧版 135deg 深棕渐变统一替换为玄墨纯色，高光改淡金 */
.hero {
    background: #221D16;
}
.hero::after {
    background: radial-gradient(circle at 70% 30%, rgba(201, 160, 99, 0.14), transparent 60%);
}

/* ===== 选区与焦点细节 ===== */
::selection {
    background: rgba(200, 70, 58, 0.16);
}

/*
 * system.css — 详解西游记 · 全站组件设计系统
 * ----------------------------------------------
 * 故宫数字馆藏 × Linear 信息密度
 *
 * 层级关系：
 *   tokens.css  → 设计令牌（变量层）
 *   system.css  → 组件样式（结构层）← 本文件
 *   页面内联    → 仅图表/数据特有样式
 *
 * 引用方式（放在 tokens.css 之后）：
 *   <link rel="stylesheet" href="../system.css">  (data/ 子目录)
 *   <link rel="stylesheet" href="system.css">      (site/ 根)
 */

/* ===== 重置与基础 ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {
    -webkit-tap-highlight-color: rgba(200, 70, 58, 0.12);
    scroll-behavior: smooth;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}
body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
    html { scroll-behavior: auto; }
}
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
}
img, svg { display: block; max-width: 100%; }
::selection { background: rgba(200, 70, 58, 0.14); }

/* ===== 排版层级 ===== */
h1, h2, h3, h4, h5 { font-family: var(--font-serif); color: var(--ink); line-height: 1.25; }
h1 { font-size: clamp(36px, 5vw, 56px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: clamp(28px, 3.5vw, 40px); font-weight: 600; }
h3 { font-size: clamp(20px, 2.5vw, 26px); font-weight: 600; }
h4 { font-size: 18px; font-weight: 500; }
.text-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.text-muted { color: var(--ink-soft); }
.text-faint { color: var(--ink-faint); }
.text-accent { color: var(--accent); }
.text-sm { font-size: 13px; }
.text-xs { font-size: 11px; letter-spacing: 0.04em; }
.kicker {
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

/* ===== 布局容器 ===== */
.page-wrap {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 clamp(24px, 6vw, 96px);
}
.section {
    padding: clamp(48px, 7vw, 88px) 0;
}
.section + .section {
    border-top: 1px solid var(--line);
}
.section-head {
    margin-bottom: clamp(28px, 4vw, 48px);
}
.section-head .kicker { margin-bottom: 12px; }
.section-head h2 { margin-bottom: 8px; }
.section-head .note { font-size: 15px; color: var(--ink-soft); max-width: 640px; }

/* ===== 顶部导航 ===== */
.topnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px clamp(24px, 6vw, 96px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(250, 247, 240, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 50;
}
.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}
.seal {
    width: 40px;
    height: 40px;
    background: var(--accent);
    border-radius: 3px;
    display: grid;
    place-items: center;
    color: #fff;
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 13px;
    line-height: 1.1;
    text-align: center;
    flex-shrink: 0;
}
.wordmark {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
}
.topnav nav {
    display: flex;
    gap: 28px;
    align-items: center;
}
.topnav nav a {
    font-size: 14px;
    color: var(--ink-soft);
    transition: color 0.15s;
    white-space: nowrap;
}
.topnav nav a:hover { color: var(--accent); }
.topnav nav a.active { color: var(--ink); font-weight: 500; }
@media (max-width: 768px) {
    .topnav { padding: 16px 20px; }
    .topnav nav { gap: 16px; }
    .topnav nav a { font-size: 13px; }
    .wordmark { font-size: 16px; }
}

/* ===== Hero（数据页通用） ===== */
.hero {
    background: var(--dark);
    background-image: url('../static/images/ink-mountains-hero.webp');
    background-size: cover;
    background-position: center 70%;
    background-blend-mode: soft-light;
    color: var(--dark-text);
    padding: clamp(48px, 8vw, 80px) clamp(24px, 6vw, 96px);
    position: relative;
    overflow: hidden;
}
.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 75% 20%, rgba(201, 160, 99, 0.10), transparent 55%);
    pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
.hero .kicker { color: var(--accent-soft); margin-bottom: 14px; }
.hero h1 {
    color: var(--dark-text);
    font-size: clamp(28px, 4vw, 44px);
    margin-bottom: 10px;
}
.hero .subtitle {
    font-size: 14px;
    color: rgba(242, 235, 220, 0.7);
    letter-spacing: 0.06em;
}
.hero .tagline {
    margin-top: 14px;
    font-size: 13px;
    color: rgba(242, 235, 220, 0.5);
    font-style: italic;
}
/* Hero 内面包屑 */
.hero .breadcrumb {
    margin-bottom: 20px;
    font-size: 12px;
    color: rgba(242, 235, 220, 0.45);
}
.hero .breadcrumb a { color: rgba(242, 235, 220, 0.6); }
.hero .breadcrumb a:hover { color: var(--accent-soft); }

/* ===== 卡片 ===== */
.card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: clamp(20px, 3vw, 28px);
    transition: border-color 0.2s, transform 0.2s;
}
.card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
}
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}
.card .card-kicker {
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin-bottom: 10px;
}
.card h3 { font-size: 20px; margin-bottom: 8px; }
.card p { font-size: 14px; color: var(--ink-soft); }
.card .card-meta {
    margin-top: 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-faint);
}

/* ===== KPI 数字卡 ===== */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
}
.kpi {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 20px;
    transition: border-color 0.2s;
}
.kpi:hover { border-color: var(--accent); }
.kpi .kpi-value {
    font-family: var(--font-mono);
    font-size: 32px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
}
.kpi .kpi-label {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink-soft);
}
.kpi .kpi-desc {
    margin-top: 4px;
    font-size: 11px;
    color: var(--ink-faint);
}

/* ===== 图表容器 ===== */
.chart-block {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: clamp(20px, 3vw, 32px);
    margin-bottom: 24px;
}
.chart-block h3 {
    font-size: 18px;
    margin-bottom: 6px;
}
.chart-block .chart-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 20px;
}
.chart-block svg { width: 100%; height: auto; }
/* 图表内 D3 元素统一样式 */
.chart-block .axis text {
    font-family: var(--font-mono);
    font-size: 11px;
    fill: var(--ink-faint);
}
.chart-block .axis line,
.chart-block .axis path {
    stroke: var(--line);
}
.chart-block .grid line {
    stroke: var(--line);
    stroke-opacity: 0.5;
}

/* ===== 表格 ===== */
.table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line);
    border-radius: 3px;
}
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}
/* 数据摘要表容器：摘要表 th 使用 white-space:nowrap，列数多时 Intrinsic 宽度
   超过移动端父容器（375px 视口下内容区约 285px），表会横向溢出被截断。
   设为横向滚动容器，使宽表在手机上可滑动查看，同时消除 CI layout 断言的
   table-overflow 告警（direct parent 的 overflow-x 命中 auto 即视为可滚动）。 */
#summary-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
thead {
    background: var(--paper-warm);
}
th {
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    text-align: left;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
}
td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255, 255, 255, 0.5); }
td.num, th.num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
}

/* ===== 标签/徽章 ===== */
.badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 3px 10px;
    border-radius: 2px;
    border: 1px solid;
}
.badge-accent { color: var(--accent); border-color: rgba(200, 70, 58, 0.25); background: rgba(200, 70, 58, 0.06); }
.badge-blue { color: var(--accent-2); border-color: rgba(58, 107, 140, 0.25); background: rgba(58, 107, 140, 0.06); }
.badge-gold { color: var(--accent-3); border-color: rgba(138, 109, 59, 0.25); background: rgba(138, 109, 59, 0.06); }
.badge-green { color: var(--accent-4); border-color: rgba(107, 142, 90, 0.25); background: rgba(107, 142, 90, 0.06); }

/* ===== 按钮 ===== */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
}
.btn-primary:hover { background: #b33d32; }

/* ===== 页脚 ===== */
.site-footer {
    border-top: 1px solid var(--line);
    padding: 40px clamp(24px, 6vw, 96px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
}
.site-footer .footer-brand {
    font-family: var(--font-serif);
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
}
.site-footer .footer-meta {
    font-size: 12px;
    color: var(--ink-faint);
}
.site-footer nav {
    display: flex;
    gap: 20px;
}
.site-footer nav a {
    font-size: 13px;
    color: var(--ink-soft);
}
.site-footer nav a:hover { color: var(--accent); }

/* ===== 深色节奏段（引文/分隔） ===== */
.dark-band {
    background: var(--dark);
    color: var(--dark-text);
    padding: clamp(56px, 8vw, 96px) clamp(24px, 6vw, 160px);
    text-align: center;
}
.dark-band .rule {
    width: 40px;
    height: 2px;
    background: var(--accent);
    margin: 0 auto 24px;
}
.dark-band blockquote {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: clamp(18px, 2.4vw, 26px);
    line-height: 1.9;
}
.dark-band .attr {
    margin-top: 20px;
    font-size: 12px;
    color: rgba(242, 235, 220, 0.5);
    letter-spacing: 0.08em;
}

/* ===== 档案索引表（首页九卷） ===== */
.index-table { width: 100%; }
.index-row {
    display: grid;
    grid-template-columns: 32px 220px 1fr auto;
    gap: 20px;
    align-items: center;
    padding: 20px 0;
    border-bottom: 1px solid var(--line);
    transition: background 0.15s;
}
.index-row:hover { background: rgba(255, 255, 255, 0.6); }
.index-row .no {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-faint);
}
.index-row .name {
    font-family: var(--font-serif);
    font-weight: 500;
    font-size: 18px;
}
.index-row .desc { font-size: 14px; color: var(--ink-soft); }
.index-row .meta {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent-2);
    text-align: right;
    white-space: nowrap;
}
@media (max-width: 768px) {
    .index-row {
        grid-template-columns: 1fr auto;
        gap: 8px;
    }
    .index-row .no { display: none; }
    .index-row .desc { grid-column: 1 / -1; }
}

/* ===== 筛选 Tab ===== */
.filter-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}
.filter-tab {
    font-size: 13px;
    font-weight: 500;
    padding: 7px 16px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s;
}
.filter-tab:hover { border-color: var(--accent); color: var(--accent); }
.filter-tab[aria-pressed="true"],
.filter-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
}

/* ===== 搜索框 ===== */
.search-box {
    position: relative;
    max-width: 400px;
}
.search-box input {
    width: 100%;
    font-size: 14px;
    padding: 10px 16px 10px 40px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
    transition: border-color 0.15s;
}
.search-box input:focus {
    outline: none;
    border-color: var(--accent);
}
.search-box::before {
    content: "搜";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--ink-faint);
}

/* ===== 空状态 ===== */
.empty-state {
    text-align: center;
    padding: 64px 24px;
    color: var(--ink-faint);
}
.empty-state .empty-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
}
.empty-state p { font-size: 15px; }

/* ===== 响应式 ===== */
@media (max-width: 768px) {
    h1 { font-size: 28px; }
    h2 { font-size: 24px; }
    .card-grid { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .site-footer { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 480px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .topnav nav { display: none; }
}

/* ===== 打印 ===== */
@media print {
    .topnav, .site-footer, .filter-tabs, .search-box { display: none; }
    body { background: #fff; }
    .card, .chart-block { border: 1px solid #ccc; break-inside: avoid; }
}

<script>
/* 内联 vis-tools.js（源 site/static/js/vis-tools.js） */
/*!
 * vis-tools.js — 《详解西游记》可视化交互增强工具库（零依赖·原生 JS）
 *
 * 提供「筛选 / 钻取 / 导出」三类可复用能力，供 site/data/*.html 调用：
 *   - exportCSV(rows, filename)        表格对象数组 → CSV（带 BOM，Excel 不乱码）
 *   - exportJSON(obj, filename)        任意对象 → .json 下载
 *   - exportSVG(svgEl, filename)       SVG 元素 → PNG（序列化后绘到 canvas）
 *   - makeFilterableTable(opts)        渲染带搜索框的可排序表格，返回控制句柄
 *   - openDrill(title, html) / closeDrill()   右侧滑入式钻取详情面板
 *
 * 不依赖任何框架；file:// 下亦可工作（导出用 Blob + a[download]，无需服务器）。
 * 设计语言沿用 tokens.css：朱砂 #c8463a / 靛青 #3a6b8c / 宣纸 #faf7f2。
 */
(function (global) {
  "use strict";

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function csvCell(v) {
    if (v === null || v === undefined) v = "";
    v = String(v);
    if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }

  function exportCSV(rows, filename) {
    if (!rows || !rows.length) { alert("没有可导出的数据"); return; }
    var cols = [];
    rows.forEach(function (r) {
      Object.keys(r).forEach(function (k) { if (cols.indexOf(k) < 0) cols.push(k); });
    });
    var lines = [cols.join(",")];
    rows.forEach(function (r) {
      lines.push(cols.map(function (k) { return csvCell(r[k]); }).join(","));
    });
    // BOM 让 Excel 正确识别 UTF-8
    var blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    downloadBlob(blob, filename || "export.csv");
  }

  function exportJSON(obj, filename) {
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json;charset=utf-8" });
    downloadBlob(blob, filename || "export.json");
  }

  function exportSVG(svgEl, filename) {
    if (!svgEl) { alert("没有可导出的图表"); return; }
    var clone = svgEl.cloneNode(true);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    var xml = new XMLSerializer().serializeToString(clone);
    var svgBlob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
    var url = URL.createObjectURL(svgBlob);
    var img = new Image();
    img.onload = function () {
      var vb = (svgEl.getAttribute("viewBox") || "0 0 600 400").split(/\s+/).map(Number);
      var w = vb[2] || svgEl.clientWidth || 600;
      var h = vb[3] || svgEl.clientHeight || 400;
      var scale = 2;
      var canvas = document.createElement("canvas");
      canvas.width = w * scale; canvas.height = h * scale;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#faf7f2";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (b) { downloadBlob(b, filename || "chart.png"); });
    };
    img.onerror = function () { URL.revokeObjectURL(url); alert("SVG 导出失败（可能含跨域字体）"); };
    img.src = url;
  }

  // ---- 可筛选可排序表格 ----
  // opts: { container, columns:[{key,label,sortable}], rows:[{}], searchKeys:[], onRowClick(row) }
  function makeFilterableTable(opts) {
    var container = typeof opts.container === "string"
      ? document.querySelector(opts.container) : opts.container;
    var columns = opts.columns || [];
    var rows = opts.rows || [];
    var searchKeys = opts.searchKeys || columns.map(function (c) { return c.key; });
    var onRowClick = opts.onRowClick || null;
    var sortKey = null, sortDir = 1;

    container.innerHTML = "";
    var toolbar = document.createElement("div");
    toolbar.className = "vt-toolbar";
    toolbar.innerHTML =
      '<input class="vt-search" type="search" placeholder="筛选 / 搜索…" aria-label="筛选表格">' +
      '<span class="vt-count"></span>' +
      '<button class="vt-btn" data-act="csv">导出 CSV</button>' +
      '<button class="vt-btn" data-act="json">导出 JSON</button>';
    container.appendChild(toolbar);

    var tableWrap = document.createElement("div");
    tableWrap.className = "vt-tablewrap";
    container.appendChild(tableWrap);

    function current() { return rows.slice(); }

    function render() {
      var q = (toolbar.querySelector(".vt-search").value || "").trim().toLowerCase();
      var data = current();
      if (q) {
        data = data.filter(function (r) {
          return searchKeys.some(function (k) {
            return String(r[k] === undefined ? "" : r[k]).toLowerCase().indexOf(q) >= 0;
          });
        });
      }
      if (sortKey) {
        data.sort(function (a, b) {
          var x = a[sortKey], y = b[sortKey];
          if (typeof x === "number" && typeof y === "number") return (x - y) * sortDir;
          return String(x).localeCompare(String(y), "zh") * sortDir;
        });
      }
      var html = "<table class=\"vt-table\"><thead><tr>";
      columns.forEach(function (c) {
        var arrow = sortKey === c.key ? (sortDir > 0 ? " ▲" : " ▼") : "";
        html += '<th data-key="' + c.key + '"' + (c.sortable === false ? "" : " class=\"vt-sortable\"") +
          ">" + (c.label || c.key) + arrow + "</th>";
      });
      html += "</tr></thead><tbody>";
      if (!data.length) {
        html += "<tr><td class=\"vt-empty\" colspan=\"" + columns.length + "\">无匹配数据</td></tr>";
      } else {
        data.forEach(function (r, i) {
          html += "<tr data-i=\"" + i + "\">";
          columns.forEach(function (c) { html += "<td>" + escapeHtml(r[c.key]) + "</td>"; });
          html += "</tr>";
        });
      }
      html += "</tbody></table>";
      tableWrap.innerHTML = html;
      toolbar.querySelector(".vt-count").textContent = "共 " + data.length + " 行";
      tableWrap._data = data;
    }

    toolbar.querySelector(".vt-search").addEventListener("input", render);
    toolbar.querySelector('[data-act="csv"]').addEventListener("click", function () {
      exportCSV(tableWrap._data || [], "xiyouji-export.csv");
    });
    toolbar.querySelector('[data-act="json"]').addEventListener("click", function () {
      exportJSON(tableWrap._data || [], "xiyouji-export.json");
    });
    tableWrap.addEventListener("click", function (e) {
      var th = e.target.closest("th.vt-sortable");
      if (th) {
        var k = th.getAttribute("data-key");
        if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
        render(); return;
      }
      var tr = e.target.closest("tr[data-i]");
      if (tr && onRowClick) {
        var i = +tr.getAttribute("data-i");
        onRowClick((tableWrap._data || [])[i], i);
      }
    });

    function setData(newRows) { rows = newRows || []; render(); }
    function setRows(newRows) { rows = newRows || []; render(); }
    render();
    return { render: render, setData: setData, setRows: setRows, getData: function () { return tableWrap._data || []; } };
  }

  function escapeHtml(s) {
    return String(s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---- 钻取详情面板（右侧滑入） ----
  function ensureDrillRoot() {
    var root = document.getElementById("vt-drill");
    if (!root) {
      root = document.createElement("div");
      root.id = "vt-drill";
      root.className = "vt-drill";
      root.innerHTML = "<div class=\"vt-drill-mask\"></div>" +
        "<aside class=\"vt-drill-panel\" role=\"dialog\" aria-modal=\"true\">" +
        "<header><span class=\"vt-drill-title\"></span>" +
        "<button class=\"vt-drill-close\" aria-label=\"关闭\">×</button></header>" +
        "<div class=\"vt-drill-body\"></div></aside>";
      document.body.appendChild(root);
      root.querySelector(".vt-drill-mask").addEventListener("click", closeDrill);
      root.querySelector(".vt-drill-close").addEventListener("click", closeDrill);
    }
    return root;
  }

  function openDrill(title, html) {
    var root = ensureDrillRoot();
    root.querySelector(".vt-drill-title").textContent = title || "";
    root.querySelector(".vt-drill-body").innerHTML = html || "";
    root.classList.add("open");
  }
  function closeDrill() {
    var root = document.getElementById("vt-drill");
    if (root) root.classList.remove("open");
  }

  // ---- 样式注入（仅一次） ----
  if (!document.getElementById("vt-style")) {
    var s = document.createElement("style");
    s.id = "vt-style";
    s.textContent =
      ".vt-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}" +
      ".vt-search{flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--line,#d9cdb8);" +
      "border-radius:8px;font-size:14px;background:var(--paper,#fff)}" +
      ".vt-count{color:var(--ink-soft,#6B6455);font-size:13px}" +
      ".vt-btn{padding:7px 12px;border:1px solid var(--accent,#c8463a);background:var(--accent,#c8463a);" +
      "color:#fff;border-radius:8px;cursor:pointer;font-size:13px}" +
      ".vt-btn:hover{opacity:.88}" +
      ".vt-tablewrap{max-height:60vh;overflow:auto;border:1px solid var(--line,#d9cdb8);border-radius:8px}" +
      ".vt-table{width:100%;border-collapse:collapse;font-size:14px}" +
      ".vt-table th,.vt-table td{padding:8px 10px;border-bottom:1px solid var(--line,#d9cdb8);text-align:left;vertical-align:top}" +
      ".vt-table thead th{position:sticky;top:0;background:var(--bg,#faf7f2);z-index:1}" +
      ".vt-table th.vt-sortable{cursor:pointer;user-select:none}" +
      ".vt-table tbody tr{cursor:pointer}" +
      ".vt-table tbody tr:hover{background:rgba(200,70,58,.06)}" +
      ".vt-empty{text-align:center;color:var(--ink-soft,#6B6455);padding:20px}" +
      ".vt-drill{position:fixed;inset:0;z-index:9999;display:none}" +
      ".vt-drill.open{display:block}" +
      ".vt-drill-mask{position:absolute;inset:0;background:rgba(35,32,26,.4)}" +
      ".vt-drill-panel{position:absolute;top:0;right:0;height:100%;width:min(460px,92vw);" +
      "background:var(--paper,#fff);box-shadow:-8px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;" +
      "transform:translateX(100%);transition:transform .25s ease;font-family:inherit}" +
      ".vt-drill.open .vt-drill-panel{transform:translateX(0)}" +
      ".vt-drill-panel header{display:flex;align-items:center;justify-content:space-between;" +
      "padding:14px 16px;border-bottom:1px solid var(--line,#d9cdb8)}" +
      ".vt-drill-title{font-weight:600;color:var(--accent,#c8463a)}" +
      ".vt-drill-close{border:none;background:none;font-size:24px;cursor:pointer;color:var(--ink-soft,#6B6455)}" +
      ".vt-drill-body{padding:16px;overflow:auto;line-height:1.7}" +
      ".vt-drill-body table{width:100%;border-collapse:collapse;margin:8px 0}" +
      ".vt-drill-body th,.vt-drill-body td{border:1px solid var(--line,#d9cdb8);padding:6px 8px;font-size:13px;text-align:left}";
    document.head.appendChild(s);
  }

  global.VisTools = {
    exportCSV: exportCSV,
    exportJSON: exportJSON,
    exportSVG: exportSVG,
    makeFilterableTable: makeFilterableTable,
    openDrill: openDrill,
    closeDrill: closeDrill,
  };
})(window);

</script>
<script>
/* 内联 dataset-view.js（源 site/static/js/dataset-view.js） */
/*!
 * dataset-view.js — 《详解西游记》单数据集可交互视图（零依赖·原生 JS）
 *
 * 把 data-explorer.html 的渲染逻辑抽成可复用模块，证明 vis-tools 范式
 * 可逐项实例化：给定数据集名 + 离线 fallback，即可渲染
 *   「键 tab → 数组表(可筛选/排序/导出/钻取) / 对象柱状图」两类视图。
 *
 * 用法（页面中）：
 *   <script src="../static/js/vis-tools.js"><\/script>
 *   <script src="../static/js/dataset-view.js"><\/script>
 *   <script>
 *     DatasetView.mount({
 *       name: "character-relationship-3d",
 *       fallback: window.CHAR_FB,            // file:// 下的离线示例
 *       bannerId: "banner", metaId: "meta",
 *       keytabsId: "keytabs", chartTitleId: "chartTitle",
 *       chartHostId: "chartHost", tableHostId: "tableHost"
 *     });
 *   <\/script>
 *
 * file:// 下 fetch 失败自动走 fallback；http(s) 下同源命中数据 API。
 */
(function (global) {
  "use strict";

  function apiFetch(path) {
    return fetch(path, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function setBanner(id, html, offline) {
    var b = document.getElementById(id);
    if (!b) return;
    b.innerHTML = html;
    b.className = "banner" + (offline ? " offline" : "");
  }

  function pickColumns(rows) {
    var cols = [];
    rows.slice(0, 50).forEach(function (r) {
      Object.keys(r).forEach(function (k) { if (cols.indexOf(k) < 0) cols.push(k); });
    });
    return cols.slice(0, 7).map(function (k) { return { key: k, label: k }; });
  }

  function openRowDrill(key, row) {
    var html = "<p><b>所属键：</b>" + key + "</p><table><tbody>";
    Object.keys(row).forEach(function (k) {
      var v = row[k];
      if (v && typeof v === "object") v = JSON.stringify(v);
      html += "<tr><th>" + k + "</th><td>" + String(v) + "</td></tr>";
    });
    html += "</tbody></table>";
    global.VisTools.openDrill((row.name || row.label || key), html);
  }

  function renderArrayTable(key, rows, tableHostId) {
    global.VisTools.makeFilterableTable({
      container: "#" + tableHostId,
      columns: pickColumns(rows),
      rows: rows,
      searchKeys: pickColumns(rows).map(function (c) { return c.key; }),
      onRowClick: function (row) { openRowDrill(key, row); }
    });
  }

  function renderObjectView(key, obj, ids) {
    var entries = Object.keys(obj).map(function (k) { return { label: k, value: obj[k] }; });
    var max = Math.max.apply(null, entries.map(function (e) { return +e.value || 0; })) || 1;
    var colors = ["#c8463a", "#3a6b8c", "#C9A063", "#6B8E5A", "#8c2a2a", "#b07a3a"];
    var svg = '<svg id="chart" viewBox="0 0 520 ' + (entries.length * 34 + 10) + '" width="100%" style="max-width:560px">';
    entries.forEach(function (e, i) {
      var w = Math.round(((+e.value || 0) / max) * 360);
      svg += '<text x="0" y="' + (i * 34 + 18) + '" font-size="12" fill="#23201A">' + e.label + "</text>";
      svg += '<rect x="120" y="' + (i * 34 + 6) + '" width="' + w + '" height="18" rx="3" fill="' + colors[i % colors.length] + '"/>';
      svg += '<text x="' + (124 + w) + '" y="' + (i * 34 + 19) + '" font-size="11" fill="#6B6455">' + e.value + "</text>";
    });
    svg += "</svg>";
    document.getElementById(ids.chartTitleId).textContent = "分布：" + key;
    document.getElementById(ids.chartHostId).innerHTML = svg;
    document.getElementById(ids.chartHostId).parentNode.style.display = "block";
    global.VisTools.makeFilterableTable({
      container: "#" + ids.tableHostId,
      columns: [{ key: "label", label: "项" }, { key: "value", label: "值" }],
      rows: entries,
      onRowClick: function (row) { openRowDrill(key, row); }
    });
  }

  function renderKey(key, value, ids) {
    document.getElementById(ids.chartHostId).parentNode.style.display = "none";
    var host = document.getElementById(ids.tableHostId);
    if (Array.isArray(value) && value.length && typeof value[0] === "object") {
      renderArrayTable(key, value, ids.tableHostId);
    } else if (value && typeof value === "object") {
      renderObjectView(key, value, ids);
    } else if (Array.isArray(value)) {
      renderArrayTable(key, value.map(function (v, i) { return { "#": i + 1, value: v }; }), ids.tableHostId);
    } else {
      host.innerHTML = "<p class='meta'>" + key + "：<b>" + String(value) + "</b></p>";
    }
  }

  function renderKeyTabs(data, ids) {
    var tabs = document.getElementById(ids.keytabsId);
    tabs.innerHTML = "";
    var keys = Object.keys(data).filter(function (k) { return k !== "meta"; });
    if (!keys.length) { document.getElementById(ids.tableHostId).textContent = "（无表格数据）"; return; }
    function choose(k) {
      document.querySelectorAll("#" + ids.keytabsId + " .keytab").forEach(function (n) { n.classList.remove("active"); });
      Array.prototype.slice.call(tabs.children).find(function (c) { return c.dataset.k === k; }).classList.add("active");
      renderKey(k, data[k], ids);
    }

<script id="audit-axisfix">
(function(){
  function fixAxes(){
    try{
      var svgs = document.querySelectorAll('svg');

<script id="audit-axisfix2">
(function(){
  function variance(a){var m=a.reduce(function(s,v){return s+v;},0)/a.length;return a.reduce(function(s,v){return s+(v-m)*(v-m);},0)/a.length;}
  function fix(){
    try{
      document.querySelectorAll('svg').forEach(function(svg){
        svg.querySelectorAll('g').forEach(function(g){
          if(!g.querySelector(':scope > .domain')) return;
          var ticks=[].slice.call(g.querySelectorAll(':scope > g.tick'));
          if(ticks.length<5) return;
          var xs=[],ys=[];
          ticks.forEach(function(t){
            var m=(t.getAttribute('transform')||'').match(/translate\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/);
            if(m){xs.push(parseFloat(m[1]));ys.push(parseFloat(m[2]));}
          });
          if(xs.length<3) return;
          var vx=variance(xs), vy=variance(ys);
          if(vx>vy){
            // 水平(底部)轴：旋转 + 缩小
            ticks.forEach(function(t){
              var tx=t.querySelector('text'); if(!tx) return;
              tx.style.transformBox='fill-box';
              tx.style.transformOrigin='top center';
              tx.style.transform='rotate(-40deg)';
              tx.style.fontSize='10px';
              tx.style.fontWeight='500';
            });
          } else {
            // 垂直(左侧)轴：缩小 + 隐藏重叠较小者
            var texts=ticks.map(function(t){return t.querySelector('text');}).filter(Boolean);
            texts.forEach(function(tx){ tx.style.fontSize='9px'; });
            var R=texts.map(function(t){return t.getBoundingClientRect();});
            for(var i=0;i<texts.length;i++){
              for(var j=i+1;j<texts.length;j++){
                var a=R[i],b=R[j];
                if(!a.width||!b.width) continue;
                var ix=Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left));
                var iy=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
                if(ix*iy<=0) continue;
                var area=Math.min(a.width*a.height,b.width*b.height);
                if(area>0 && (ix*iy)/area>0.5){
                  var hide=(a.width*a.height<=(b.width*b.height))?texts[i]:texts[j];
                  if(hide.style.display!=='none') hide.style.display='none';
                }
              }
            }
          }
        });
      });
    }catch(e){ /* noop */ }
  }
  function run(){ setTimeout(fix,800); setTimeout(fix,2600); setTimeout(fix,5000); }
  if(document.readyState==='complete'){ run(); }
  else { window.addEventListener('load', run); }
})();
</script>

<script id="audit-axisfix4">
(function(){
  var NUM=/^(第?\d+回?|\d+(\.\d+)?|\d+%?|W\d+)$/;
  function bbox(t){return t.getBoundingClientRect();}
  function fix(){
    try{
      document.querySelectorAll('svg').forEach(function(svg){
        var all=[].slice.call(svg.querySelectorAll('text')).filter(function(t){var r=bbox(t);return r.width>0&&r.height>0;});
        var nums=all.filter(function(t){return NUM.test((t.textContent||'').trim());});
        var axisNum=new Set();
        var rows={},cols={};
        nums.forEach(function(t){var r=bbox(t);var y=Math.round(r.top/8)*8;rows[y]=rows[y]||[];rows[y].push(t);var x=Math.round(r.left/8)*8;cols[x]=cols[x]||[];cols[x].push(t);});
        Object.keys(rows).forEach(function(k){if(rows[k].length>=3)rows[k].forEach(function(t){axisNum.add(t);});});
        Object.keys(cols).forEach(function(k){if(cols[k].length>=3)cols[k].forEach(function(t){axisNum.add(t);});});
        axisNum.forEach(function(t){t.style.fontSize='9px';t.style.fontWeight='500';});
        for(var i=0;i<all.length;i++){
          for(var j=i+1;j<all.length;j++){
            var a=all[i],b=all[j];
            var ra=bbox(a),rb=bbox(b);
            var ix=Math.max(0,Math.min(ra.right,rb.right)-Math.max(ra.left,rb.left));
            var iy=Math.max(0,Math.min(ra.bottom,rb.bottom)-Math.max(ra.top,rb.top));
            var inter=ix*iy; if(inter<=0) continue;
            var area=Math.min(ra.width*ra.height,rb.width*rb.height);
            if(area<=0||inter/area<0.4) continue;
            var ta=(a.textContent||'').trim(),tb=(b.textContent||'').trim();
            var dup=ta&&ta===tb;
            var aAxis=axisNum.has(a),bAxis=axisNum.has(b);
            var aNum=NUM.test(ta),bNum=NUM.test(tb);
            var act=false;
            if(dup)act=true; else if(aAxis||bAxis)act=true; else if(aNum&&bNum)act=true;
            if(!act) continue;
            var hide,keep;
            if(dup){ hide=(ta.length<=tb.length)?a:b; keep=(hide===a)?b:a; }
            else { hide=(ra.width*ra.height<=rb.width*rb.height)?a:b; keep=(hide===a)?b:a; }
            if(hide.style.display!=='none'){
              hide.setAttribute('data-axisfix4','1');
              if(!hide.getAttribute('title')) hide.setAttribute('title',(hide.textContent||'').trim());
              hide.style.display='none';
            }
          }
        }
      });
    }catch(e){}
  }
  function run(){[800,2600,5000,8000,11000].forEach(function(t){setTimeout(fix,t);});}
  if(document.readyState==='complete')run();else window.addEventListener('load',run);
})();
</script>
