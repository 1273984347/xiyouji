<script>
/* 内联 vis-tools.js（源 site/static/js/vis-tools.js） */
/*!
 * vis-tools.js — 《详解西游记》可视化交互增强工具库（零依赖·原生 JS）
 *
 * 提供「筛选 / 钻取 / 导出」三类可复用能力，供 site/data/*.html 调用：
 *   - exportCSV(rows, filename)        表格对象数组 → CSV（带 BOM，Excel 不乱码）
 *   - exportJSON(obj, filename)        任意对象 → .json 下载
 *   - exportSVG(svgEl, filename)       SVG 元素 → PNG（序列化后绘到 canvas）
 *   - makeFilterableTable(opts)        渲染带搜索框的可排序表格，返回控制句柄
 *   - openDrill(title, html) / closeDrill()   右侧滑入式钻取详情面板
 *
 * 不依赖任何框架；file:// 下亦可工作（导出用 Blob + a[download]，无需服务器）。
 * 设计语言沿用 tokens.css：朱砂 #c8463a / 靛青 #3a6b8c / 宣纸 #faf7f2。
 */
(function (global) {
  "use strict";

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function csvCell(v) {
    if (v === null || v === undefined) v = "";
    v = String(v);
    if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }

  function exportCSV(rows, filename) {
    if (!rows || !rows.length) { alert("没有可导出的数据"); return; }
    var cols = [];
    rows.forEach(function (r) {
      Object.keys(r).forEach(function (k) { if (cols.indexOf(k) < 0) cols.push(k); });
    });
    var lines = [cols.join(",")];
    rows.forEach(function (r) {
      lines.push(cols.map(function (k) { return csvCell(r[k]); }).join(","));
    });
    // BOM 让 Excel 正确识别 UTF-8
    var blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    downloadBlob(blob, filename || "export.csv");
  }

  function exportJSON(obj, filename) {
    var blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json;charset=utf-8" });
    downloadBlob(blob, filename || "export.json");
  }

  function exportSVG(svgEl, filename) {
    if (!svgEl) { alert("没有可导出的图表"); return; }
    var clone = svgEl.cloneNode(true);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    var xml = new XMLSerializer().serializeToString(clone);
    var svgBlob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
    var url = URL.createObjectURL(svgBlob);
    var img = new Image();
    img.onload = function () {
      var vb = (svgEl.getAttribute("viewBox") || "0 0 600 400").split(/\s+/).map(Number);
      var w = vb[2] || svgEl.clientWidth || 600;
      var h = vb[3] || svgEl.clientHeight || 400;
      var scale = 2;
      var canvas = document.createElement("canvas");
      canvas.width = w * scale; canvas.height = h * scale;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#faf7f2";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (b) { downloadBlob(b, filename || "chart.png"); });
    };
    img.onerror = function () { URL.revokeObjectURL(url); alert("SVG 导出失败（可能含跨域字体）"); };
    img.src = url;
  }

  // ---- 可筛选可排序表格 ----
  // opts: { container, columns:[{key,label,sortable}], rows:[{}], searchKeys:[], onRowClick(row) }
  function makeFilterableTable(opts) {
    var container = typeof opts.container === "string"
      ? document.querySelector(opts.container) : opts.container;
    var columns = opts.columns || [];
    var rows = opts.rows || [];
    var searchKeys = opts.searchKeys || columns.map(function (c) { return c.key; });
    var onRowClick = opts.onRowClick || null;
    var sortKey = null, sortDir = 1;

    container.innerHTML = "";
    var toolbar = document.createElement("div");
    toolbar.className = "vt-toolbar";
    toolbar.innerHTML =
      '<input class="vt-search" type="search" placeholder="筛选 / 搜索…" aria-label="筛选表格">' +
      '<span class="vt-count"></span>' +
      '<button class="vt-btn" data-act="csv">导出 CSV</button>' +
      '<button class="vt-btn" data-act="json">导出 JSON</button>';
    container.appendChild(toolbar);

    var tableWrap = document.createElement("div");
    tableWrap.className = "vt-tablewrap";
    container.appendChild(tableWrap);

    function current() { return rows.slice(); }

    function render() {
      var q = (toolbar.querySelector(".vt-search").value || "").trim().toLowerCase();
      var data = current();
      if (q) {
        data = data.filter(function (r) {
          return searchKeys.some(function (k) {
            return String(r[k] === undefined ? "" : r[k]).toLowerCase().indexOf(q) >= 0;
          });
        });
      }
      if (sortKey) {
        data.sort(function (a, b) {
          var x = a[sortKey], y = b[sortKey];
          if (typeof x === "number" && typeof y === "number") return (x - y) * sortDir;
          return String(x).localeCompare(String(y), "zh") * sortDir;
        });
      }
      var html = "<table class=\"vt-table\"><thead><tr>";
      columns.forEach(function (c) {
        var arrow = sortKey === c.key ? (sortDir > 0 ? " ▲" : " ▼") : "";
        html += '<th data-key="' + c.key + '"' + (c.sortable === false ? "" : " class=\"vt-sortable\"") +
          ">" + (c.label || c.key) + arrow + "</th>";
      });
      html += "</tr></thead><tbody>";
      if (!data.length) {
        html += "<tr><td class=\"vt-empty\" colspan=\"" + columns.length + "\">无匹配数据</td></tr>";
      } else {
        data.forEach(function (r, i) {
          html += "<tr data-i=\"" + i + "\">";
          columns.forEach(function (c) { html += "<td>" + escapeHtml(r[c.key]) + "</td>"; });
          html += "</tr>";
        });
      }
      html += "</tbody></table>";
      tableWrap.innerHTML = html;
      toolbar.querySelector(".vt-count").textContent = "共 " + data.length + " 行";
      tableWrap._data = data;
    }

    toolbar.querySelector(".vt-search").addEventListener("input", render);
    toolbar.querySelector('[data-act="csv"]').addEventListener("click", function () {
      exportCSV(tableWrap._data || [], "xiyouji-export.csv");
    });
    toolbar.querySelector('[data-act="json"]').addEventListener("click", function () {
      exportJSON(tableWrap._data || [], "xiyouji-export.json");
    });
    tableWrap.addEventListener("click", function (e) {
      var th = e.target.closest("th.vt-sortable");
      if (th) {
        var k = th.getAttribute("data-key");
        if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = 1; }
        render(); return;
      }
      var tr = e.target.closest("tr[data-i]");
      if (tr && onRowClick) {
        var i = +tr.getAttribute("data-i");
        onRowClick((tableWrap._data || [])[i], i);
      }
    });

    function setData(newRows) { rows = newRows || []; render(); }
    function setRows(newRows) { rows = newRows || []; render(); }
    render();
    return { render: render, setData: setData, setRows: setRows, getData: function () { return tableWrap._data || []; } };
  }

  function escapeHtml(s) {
    return String(s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---- 钻取详情面板（右侧滑入） ----
  function ensureDrillRoot() {
    var root = document.getElementById("vt-drill");
    if (!root) {
      root = document.createElement("div");
      root.id = "vt-drill";
      root.className = "vt-drill";
      root.innerHTML = "<div class=\"vt-drill-mask\"></div>" +
        "<aside class=\"vt-drill-panel\" role=\"dialog\" aria-modal=\"true\">" +
        "<header><span class=\"vt-drill-title\"></span>" +
        "<button class=\"vt-drill-close\" aria-label=\"关闭\">×</button></header>" +
        "<div class=\"vt-drill-body\"></div></aside>";
      document.body.appendChild(root);
      root.querySelector(".vt-drill-mask").addEventListener("click", closeDrill);
      root.querySelector(".vt-drill-close").addEventListener("click", closeDrill);
    }
    return root;
  }

  function openDrill(title, html) {
    var root = ensureDrillRoot();
    root.querySelector(".vt-drill-title").textContent = title || "";
    root.querySelector(".vt-drill-body").innerHTML = html || "";
    root.classList.add("open");
  }
  function closeDrill() {
    var root = document.getElementById("vt-drill");
    if (root) root.classList.remove("open");
  }

  // ---- 样式注入（仅一次） ----
  if (!document.getElementById("vt-style")) {
    var s = document.createElement("style");
    s.id = "vt-style";
    s.textContent =
      ".vt-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}" +
      ".vt-search{flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--line,#d9cdb8);" +
      "border-radius:8px;font-size:14px;background:var(--paper,#fff)}" +
      ".vt-count{color:var(--ink-soft,#6B6455);font-size:13px}" +
      ".vt-btn{padding:7px 12px;border:1px solid var(--accent,#c8463a);background:var(--accent,#c8463a);" +
      "color:#fff;border-radius:8px;cursor:pointer;font-size:13px}" +
      ".vt-btn:hover{opacity:.88}" +
      ".vt-tablewrap{max-height:60vh;overflow:auto;border:1px solid var(--line,#d9cdb8);border-radius:8px}" +
      ".vt-table{width:100%;border-collapse:collapse;font-size:14px}" +
      ".vt-table th,.vt-table td{padding:8px 10px;border-bottom:1px solid var(--line,#d9cdb8);text-align:left;vertical-align:top}" +
      ".vt-table thead th{position:sticky;top:0;background:var(--bg,#faf7f2);z-index:1}" +
      ".vt-table th.vt-sortable{cursor:pointer;user-select:none}" +
      ".vt-table tbody tr{cursor:pointer}" +
      ".vt-table tbody tr:hover{background:rgba(200,70,58,.06)}" +
      ".vt-empty{text-align:center;color:var(--ink-soft,#6B6455);padding:20px}" +
      ".vt-drill{position:fixed;inset:0;z-index:9999;display:none}" +
      ".vt-drill.open{display:block}" +
      ".vt-drill-mask{position:absolute;inset:0;background:rgba(35,32,26,.4)}" +
      ".vt-drill-panel{position:absolute;top:0;right:0;height:100%;width:min(460px,92vw);" +
      "background:var(--paper,#fff);box-shadow:-8px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;" +
      "transform:translateX(100%);transition:transform .25s ease;font-family:inherit}" +
      ".vt-drill.open .vt-drill-panel{transform:translateX(0)}" +
      ".vt-drill-panel header{display:flex;align-items:center;justify-content:space-between;" +
      "padding:14px 16px;border-bottom:1px solid var(--line,#d9cdb8)}" +
      ".vt-drill-title{font-weight:600;color:var(--accent,#c8463a)}" +
      ".vt-drill-close{border:none;background:none;font-size:24px;cursor:pointer;color:var(--ink-soft,#6B6455)}" +
      ".vt-drill-body{padding:16px;overflow:auto;line-height:1.7}" +
      ".vt-drill-body table{width:100%;border-collapse:collapse;margin:8px 0}" +
      ".vt-drill-body th,.vt-drill-body td{border:1px solid var(--line,#d9cdb8);padding:6px 8px;font-size:13px;text-align:left}";
    document.head.appendChild(s);
  }

  global.VisTools = {
    exportCSV: exportCSV,
    exportJSON: exportJSON,
    exportSVG: exportSVG,
    makeFilterableTable: makeFilterableTable,
    openDrill: openDrill,
    closeDrill: closeDrill,
  };
})(window);

</script>
<script>
// ---- 离线降级：file:// 下无 API 时，内置 81-hardships 聚合示例 ----
var FALLBACK = {
  "81-hardships": {
    meta: { title: "八十一难（离线示例）", note: "内置聚合，启动 API 可得完整 81 难明细" },
    by_cause: { "如来/观音安排": 27, "真火锻性": 28, "天界/西域佛祖下凡收徒": 16, "人心自生的障碍": 10 },
    by_ending: { "被收走（有后台）": 44, "被打死（无后台）": 37 },
    by_difficulty: { "高": 22, "中": 41, "低": 18 }
  }
};
var API_BASE = location.origin + location.pathname.replace(/\/site\/.*/, "") ;
// 直接相对请求（同源）：用空基址让 /dataset 命中 API（若由 API 托管）或 file:// 失败
var API_OK = false;
var CUR = { name: null, data: null, key: null };

function setBanner(html, offline) {
  var b = document.getElementById("banner");
  b.innerHTML = html;
  b.className = "banner" + (offline ? " offline" : "");
}

function apiFetch(path) {
  // 尝试本页同源的 API；file:// 下 fetch 会抛错，被 catch 捕获走降级
  return fetch(path, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

function loadDatasets() {
  apiFetch("/datasets").then(function (list) {
    API_OK = true;
    setBanner("已连接数据 API · 共 " + list.length + " 个数据集 · 支持筛选/钻取/导出。", false);
    renderPicker(list.map(function (d) { return { name: d.name, title: d.title, size: d.size_kb }; }));
  }).catch(function () {
    API_OK = false;
    setBanner("离线模式（file://）：仅内置示例可用。启动 <code>python scripts/api/api_server.py</code> 后通过 http://127.0.0.1:8787/data/data-explorer.html 访问，即可浏览全部 40 个数据集。", true);
    var names = Object.keys(FALLBACK);
    renderPicker(names.map(function (n) { return { name: n, title: (FALLBACK[n].meta || {}).title || n, size: null }; }));
  });
}

function renderPicker(items) {
  var box = document.getElementById("picker");
  box.innerHTML = "";
  items.forEach(function (it) {
    var div = document.createElement("div");
    div.className = "item";
    div.innerHTML = it.name + (it.title ? "<small>" + it.title + "</small>" : "") +
      (it.size ? "<small>" + it.size + " KB</small>" : "");
    div.addEventListener("click", function () { selectDataset(it.name, div); });
    box.appendChild(div);
  });
  if (items.length) selectDataset(items[0].name, box.firstChild);
}

function selectDataset(name, el) {
  document.querySelectorAll("#picker .item").forEach(function (n) { n.classList.remove("active"); });
  if (el) el.classList.add("active");
  CUR.name = name;
  var load = API_OK
    ? apiFetch("/dataset/" + name)
    : Promise.resolve(FALLBACK[name] || null);
  load.then(function (data) {
    if (!data) { document.getElementById("meta").textContent = "（该数据集需启动 API 才能获取）"; return; }
    CUR.data = data;
    var title = (data.meta && data.meta.title) || name;
    document.getElementById("meta").textContent = "数据集：" + name + (data.meta && data.meta.note ? " · " + data.meta.note : "");
    renderKeyTabs(data);
  }).catch(function () {
    document.getElementById("meta").textContent = "加载失败。";
  });
}

function renderKeyTabs(data) {
  var tabs = document.getElementById("keytabs");
  tabs.innerHTML = "";
  var keys = Object.keys(data).filter(function (k) { return k !== "meta"; });
  if (!keys.length) { document.getElementById("tableHost").textContent = "（无表格数据）"; return; }
  function choose(k) {
    CUR.key = k;
    document.querySelectorAll("#keytabs .keytab").forEach(function (n) { n.classList.remove("active"); });
    Array.prototype.slice.call(tabs.children).find(function (c) { return c.dataset.k === k; }).classList.add("active");
    renderKey(k, data[k]);
  }
  keys.forEach(function (k) {
    var t = document.createElement("span");
    t.className = "keytab"; t.dataset.k = k; t.textContent = k;
    t.addEventListener("click", function () { choose(k); });
    tabs.appendChild(t);
  });
  choose(keys[0]);
}

function renderKey(key, value) {
  document.getElementById("chartbox").style.display = "none";
  var host = document.getElementById("tableHost");
  if (Array.isArray(value) && value.length && typeof value[0] === "object") {
    renderArrayTable(key, value);
  } else if (value && typeof value === "object") {
    // 对象 → 柱状图 + 表
    renderObjectView(key, value);
  } else if (Array.isArray(value)) {
    renderArrayTable(key, value.map(function (v, i) { return { "#": i + 1, value: v }; }));
  } else {
    host.innerHTML = "<p class='meta'>" + key + "：<b>" + String(value) + "</b></p>";
  }
}

function pickColumns(rows) {
  var cols = [];
  rows.slice(0, 50).forEach(function (r) {
    Object.keys(r).forEach(function (k) { if (cols.indexOf(k) < 0) cols.push(k); });
  });
  return cols.slice(0, 7).map(function (k) { return { key: k, label: k }; });
}

function renderArrayTable(key, rows) {
  VisTools.makeFilterableTable({
    container: "#tableHost",
    columns: pickColumns(rows),
    rows: rows,
    searchKeys: pickColumns(rows).map(function (c) { return c.key; }),
    onRowClick: function (row) { openRowDrill(key, row); }
  });
}

function renderObjectView(key, obj) {
  var entries = Object.keys(obj).map(function (k) { return { label: k, value: obj[k] }; });
  // 柱状图（横向）
  var max = Math.max.apply(null, entries.map(function (e) { return +e.value || 0; })) || 1;
  var colors = ["#c8463a", "#3a6b8c", "#C9A063", "#6B8E5A", "#8c2a2a", "#b07a3a"];
  var svg = '<svg id="chart" viewBox="0 0 520 ' + (entries.length * 34 + 10) + '" width="100%" style="max-width:560px">';
  entries.forEach(function (e, i) {
    var w = Math.round(((+e.value || 0) / max) * 360);
    svg += '<text x="0" y="' + (i * 34 + 18) + '" font-size="12" fill="#23201A">' + e.label + "</text>";
    svg += '<rect x="120" y="' + (i * 34 + 6) + '" width="' + w + '" height="18" rx="3" fill="' + colors[i % colors.length] + '"/>';
    svg += '<text x="' + (124 + w) + '" y="' + (i * 34 + 19) + '" font-size="11" fill="#6B6455">' + e.value + "</text>";
  });
  svg += "</svg>";
  document.getElementById("chartTitle").textContent = "分布：" + key;
  document.getElementById("chartHost").innerHTML = svg;
  document.getElementById("chartbox").style.display = "block";
  VisTools.makeFilterableTable({
    container: "#tableHost",
    columns: [{ key: "label", label: "项" }, { key: "value", label: "值" }],
    rows: entries,
    onRowClick: function (row) { openRowDrill(key, row); }
  });
}

function openRowDrill(key, row) {
  var html = "<p><b>所属键：</b>" + key + "</p><table><tbody>";
  Object.keys(row).forEach(function (k) {
    var v = row[k];
    if (v && typeof v === "object") v = JSON.stringify(v);
    html += "<tr><th>" + k + "</th><td>" + String(v) + "</td></tr>";
  });
  html += "</tbody></table>";
  VisTools.openDrill((row.name || row.label || key), html);
}

document.getElementById("pngBtn").addEventListener("click", function () {
  var svg = document.querySelector("#chartHost svg");
  VisTools.exportSVG(svg, (CUR.name || "chart") + "-" + (CUR.key || "chart") + ".png");
});

loadDatasets();

<script id="audit-axisfix2">
(function(){
  function variance(a){var m=a.reduce(function(s,v){return s+v;},0)/a.length;return a.reduce(function(s,v){return s+(v-m)*(v-m);},0)/a.length;}
  function fix(){
    try{
      document.querySelectorAll('svg').forEach(function(svg){
        svg.querySelectorAll('g').forEach(function(g){
          if(!g.querySelector(':scope > .domain')) return;
          var ticks=[].slice.call(g.querySelectorAll(':scope > g.tick'));
          if(ticks.length<5) return;
          var xs=[],ys=[];
          ticks.forEach(function(t){
            var m=(t.getAttribute('transform')||'').match(/translate\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/);
            if(m){xs.push(parseFloat(m[1]));ys.push(parseFloat(m[2]));}
          });
          if(xs.length<3) return;
          var vx=variance(xs), vy=variance(ys);
          if(vx>vy){
            // 水平(底部)轴：旋转 + 缩小
            ticks.forEach(function(t){
              var tx=t.querySelector('text'); if(!tx) return;
              tx.style.transformBox='fill-box';
              tx.style.transformOrigin='top center';
              tx.style.transform='rotate(-40deg)';
              tx.style.fontSize='10px';
              tx.style.fontWeight='500';
            });
          } else {
            // 垂直(左侧)轴：缩小 + 隐藏重叠较小者
            var texts=ticks.map(function(t){return t.querySelector('text');}).filter(Boolean);
            texts.forEach(function(tx){ tx.style.fontSize='9px'; });
            var R=texts.map(function(t){return t.getBoundingClientRect();});
            for(var i=0;i<texts.length;i++){
              for(var j=i+1;j<texts.length;j++){
                var a=R[i],b=R[j];
                if(!a.width||!b.width) continue;
                var ix=Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left));
                var iy=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
                if(ix*iy<=0) continue;
                var area=Math.min(a.width*a.height,b.width*b.height);
                if(area>0 && (ix*iy)/area>0.5){
                  var hide=(a.width*a.height<=(b.width*b.height))?texts[i]:texts[j];
                  if(hide.style.display!=='none') hide.style.display='none';
                }
              }
            }
          }
        });
      });
    }catch(e){ /* noop */ }
  }
  function run(){ setTimeout(fix,800); setTimeout(fix,2600); setTimeout(fix,5000); }
  if(document.readyState==='complete'){ run(); }
  else { window.addEventListener('load', run); }
})();
</script>

<script id="audit-axisfix4">
(function(){
  var NUM=/^(第?\d+回?|\d+(\.\d+)?|\d+%?|W\d+)$/;
  function bbox(t){return t.getBoundingClientRect();}
  function fix(){
    try{
      document.querySelectorAll('svg').forEach(function(svg){
        var all=[].slice.call(svg.querySelectorAll('text')).filter(function(t){var r=bbox(t);return r.width>0&&r.height>0;});
        var nums=all.filter(function(t){return NUM.test((t.textContent||'').trim());});
        var axisNum=new Set();
        var rows={},cols={};
        nums.forEach(function(t){var r=bbox(t);var y=Math.round(r.top/8)*8;rows[y]=rows[y]||[];rows[y].push(t);var x=Math.round(r.left/8)*8;cols[x]=cols[x]||[];cols[x].push(t);});
        Object.keys(rows).forEach(function(k){if(rows[k].length>=3)rows[k].forEach(function(t){axisNum.add(t);});});
        Object.keys(cols).forEach(function(k){if(cols[k].length>=3)cols[k].forEach(function(t){axisNum.add(t);});});
        axisNum.forEach(function(t){t.style.fontSize='9px';t.style.fontWeight='500';});
        for(var i=0;i<all.length;i++){
          for(var j=i+1;j<all.length;j++){
            var a=all[i],b=all[j];
            var ra=bbox(a),rb=bbox(b);
            var ix=Math.max(0,Math.min(ra.right,rb.right)-Math.max(ra.left,rb.left));
            var iy=Math.max(0,Math.min(ra.bottom,rb.bottom)-Math.max(ra.top,rb.top));
            var inter=ix*iy; if(inter<=0) continue;
            var area=Math.min(ra.width*ra.height,rb.width*rb.height);
            if(area<=0||inter/area<0.4) continue;
            var ta=(a.textContent||'').trim(),tb=(b.textContent||'').trim();
            var dup=ta&&ta===tb;
            var aAxis=axisNum.has(a),bAxis=axisNum.has(b);
            var aNum=NUM.test(ta),bNum=NUM.test(tb);
            var act=false;
            if(dup)act=true; else if(aAxis||bAxis)act=true; else if(aNum&&bNum)act=true;
            if(!act) continue;
            var hide,keep;
            if(dup){ hide=(ta.length<=tb.length)?a:b; keep=(hide===a)?b:a; }
            else { hide=(ra.width*ra.height<=rb.width*rb.height)?a:b; keep=(hide===a)?b:a; }
            if(hide.style.display!=='none'){
              hide.setAttribute('data-axisfix4','1');
              if(!hide.getAttribute('title')) hide.setAttribute('title',(hide.textContent||'').trim());
              hide.style.display='none';
            }
          }
        }
      });
    }catch(e){}
  }
  function run(){[800,2600,5000,8000,11000].forEach(function(t){setTimeout(fix,t);});}
  if(document.readyState==='complete')run();else window.addEventListener('load',run);
})();
</script>

<script>
// 墨韵（W463）：fetch loading 骨架自移除——目标容器出现内容后移除；8s 超时兜底（防永久骨架·fail-open）
(function () {
    var els = Array.prototype.slice.call(document.querySelectorAll('.chart-loading'));
    if (!els.length) return;
    function rm(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }
    els.forEach(function (el) {
        try {
            var host = el.parentElement;
            if (!host) { rm(el); return; }
            var next = el.nextElementSibling;
            var watchSvg = next && next.tagName === 'svg' ? next : null;
            function done() {
                return watchSvg
                    ? watchSvg.childElementCount > 0
                    : Array.prototype.some.call(host.children, function (c) { return c !== el; });
            }
            if (done()) { rm(el); return; }  /* 初始已渲染（microtask 先于本脚本）直接移除 */
            var mo = new MutationObserver(function () {
                if (done()) { mo.disconnect(); rm(el); }
            });
            mo.observe(watchSvg || host, { childList: true });
        } catch (_) { rm(el); }
    });
    setTimeout(function () { els.forEach(rm); }, 8000);
})();
</script>
