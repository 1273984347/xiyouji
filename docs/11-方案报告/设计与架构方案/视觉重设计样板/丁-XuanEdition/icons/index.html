<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向丁 · Xuan Edition — 图标总览（8 枚 · 宣纸刻本 · 24/16px 双档）</title>
<link rel="stylesheet" href="../tokens.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--xu-paper);color:var(--xu-ink);font-family:var(--xu-sans);font-size:.9375rem;line-height:1.75}
h1,h2,h3{font-family:var(--xu-serif);font-weight:600;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem)}
.head{padding:clamp(2rem,5vw,3.25rem) 0 0}
.eyebrow{font-size:.75rem;letter-spacing:.18em;color:var(--xu-ink-2)}
h1{font-size:clamp(1.5rem,1rem+2.4vw,2.25rem);line-height:1.28;margin:1rem 0 0}
.rule{width:3.5rem;height:var(--xu-bar);background:var(--xu-cinnabar);margin:1.25rem 0 1rem}
.lede{font-size:1rem;color:var(--xu-ink-2);max-width:64ch}
.specs{display:flex;flex-wrap:wrap;gap:.5rem .625rem;margin-top:1.25rem}
.spec{border:var(--xu-hair) solid var(--xu-rule);background:var(--xu-surface);padding:.25rem .625rem;font-size:.75rem;color:var(--xu-ink-2);border-radius:var(--xu-radius)}
.spec b{color:var(--xu-ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.75rem 2.75rem;margin-top:2.25rem}
.card{border:var(--xu-hair) solid var(--xu-rule);background:var(--xu-surface);border-radius:var(--xu-radius);padding:1.125rem 1.25rem 1rem}
.card__head{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;border-bottom:var(--xu-hair) solid var(--xu-rule);padding-bottom:.625rem}
.card__name{font-size:1rem}
.card__file{font-size:.75rem;color:var(--xu-ink-2);letter-spacing:.04em}
.rows{margin-top:.875rem;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.875rem 1.25rem}
.plate{border:var(--xu-hair) solid var(--xu-rule);border-radius:var(--xu-radius);padding:.625rem;display:flex;align-items:center;gap:.875rem}
.plate--light{background:#F5F0E4;color:#1C1A17}
.plate--dark{background:#1A1714;color:#F0E9DA}
.plate__lab{font-size:.6875rem;letter-spacing:.08em;opacity:.75;margin:0 0 .375rem}
.ic{display:block}
.rail{position:relative;display:inline-block}
.rail::after{content:'';position:absolute;inset:2px;border:1px dashed currentColor;opacity:.28;pointer-events:none}
.rail--sm::after{inset:1px}
.note{margin-top:2.25rem;border-top:var(--xu-hair) solid var(--xu-rule);padding:1.375rem 0 3rem;font-size:.8125rem;color:var(--xu-ink-2);max-width:80ch}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <p class="eyebrow">方向丁 · Xuan Edition 宣纸刻本</p>
    <h1>图标总览 · 8 枚 UI 图标</h1>
    <div class="rule"></div>
    <p class="lede">宣纸刻本风格的 8 枚界面图标：几何规整、坐标直接对齐 24×24 栅格，无 <code>transform</code> 缩放凑合；描边 1.5px、圆头圆角端点，视觉边距 ≥ 2px。虚线框为 24×24 画布内的安全区示意，图标墨迹全部落在框内。</p>
    <div class="specs">
      <span class="spec">画布 <b>24 × 24</b></span>
      <span class="spec">描边 <b>1.5px</b></span>
      <span class="spec">视觉边距 <b>≥ 2px</b></span>
      <span class="spec">端点 <b>round / round</b></span>
      <span class="spec">状态双档 <b>24px · 16px</b></span>
      <span class="spec">底色双档 <b>宣纸 · 墨底</b></span>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <p class="note" id="note"></p>
</div>
<script>
(function(){
'use strict';
var DATA=[{"f":"search","zh":"检索","b":"<circle cx=\"10.5\" cy=\"10.5\" r=\"6\"/> <path d=\"M15 15l4.5 4.5\"/>"},{"f":"menu","zh":"目录","b":"<path d=\"M3 6v12\"/> <path d=\"M6.5 7.5h13.5M6.5 12h13.5M6.5 16.5h13.5\"/>"},{"f":"chart","zh":"图表","b":"<path d=\"M4 4.5v15h16\"/> <path d=\"M8 19.5v-6M12 19.5v-10M16 19.5v-7.5\"/>"},{"f":"book","zh":"典籍","b":"<rect x=\"6.5\" y=\"3.5\" width=\"13.5\" height=\"17\" rx=\"2\"/> <path d=\"M10 3.5v17\"/> <path d=\"M13 7.5h4M13 12h4M13 16.5h4\"/>"},{"f":"close","zh":"关闭","b":"<path d=\"M6.5 6.5l11 11M17.5 6.5l-11 11\"/>"},{"f":"check","zh":"确认","b":"<path d=\"M5 12.5l4.8 4.8L19 6.6\"/>"},{"f":"warn","zh":"警示","b":"<path d=\"M12 4.5L20.5 19.5H3.5z\"/> <path d=\"M12 10v4.2\"/> <path d=\"M12 17v1\"/>"},{"f":"globe","zh":"语言","b":"<circle cx=\"12\" cy=\"12\" r=\"8.25\"/> <path d=\"M3.75 12h16.5\"/> <ellipse cx=\"12\" cy=\"12\" rx=\"3.75\" ry=\"8.25\"/>"}];
function mark(body,size){
  return '<span class="rail'+(size===16?' rail--sm':'')+'" style="width:'+size+'px;height:'+size+'px"><svg class="ic" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+body+'</svg></span>';
}
var grid=document.getElementById('grid');
var html='';
DATA.forEach(function(d){
  html+='<section class="card">'
    +'<div class="card__head"><h2 class="card__name">'+d.zh+'</h2><span class="card__file">'+d.f+'.svg</span></div>'
    +'<div class="rows">'
    +'<div class="plate plate--light"><div><p class="plate__lab">宣纸底 · 24px</p>'+mark(d.b,24)+'</div><div><p class="plate__lab">16px</p>'+mark(d.b,16)+'</div></div>'
    +'<div class="plate plate--dark"><div><p class="plate__lab">墨底 · 24px</p>'+mark(d.b,24)+'</div><div><p class="plate__lab">16px</p>'+mark(d.b,16)+'</div></div>'
    +'</div></section>';
});
grid.innerHTML=html;
document.getElementById('note').textContent='全部图标以 currentColor 取色，随明暗两态令牌自动切换；单枚文件均 ≤ 2KB，页面零外域依赖。';
})();
</script>
</body>
</html>
