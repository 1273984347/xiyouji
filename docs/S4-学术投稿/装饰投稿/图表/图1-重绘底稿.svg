  <g stroke="#C8463A" stroke-width="4" fill="#C8463A">
    <line x1="302" y1="205" x2="332" y2="205"/><polygon points="332,197 348,205 332,213"/>
    <line x1="622" y1="205" x2="652" y2="205"/><polygon points="652,197 668,205 652,213"/>
    <line x1="942" y1="205" x2="972" y2="205"/><polygon points="972,197 988,205 972,213"/>
