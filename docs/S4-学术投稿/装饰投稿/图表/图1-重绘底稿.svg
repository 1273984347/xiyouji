  <text x="800" y="230" text-anchor="middle" font-size="22" fill="#23201A">--accent  #C8463A</text>
  <text x="800" y="300" text-anchor="middle" font-size="21" fill="#C8463A">设计变量转译</text>

  <text x="1120" y="160" text-anchor="middle" font-size="23" fill="#23201A">tokens.css 单一事实源</text>
