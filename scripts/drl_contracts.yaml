# DRL Contracts — pre-commit 批量验证定义
#
# 用途：每次 git commit 时由 pre-commit hook 调用 drl_spotcheck.py --batch 验证
#       确保"修复声明已落地"的文件内容实际包含期望值（E1 升级版铁律工程化）
#
# 更新规则：每次版本 bump（W### 推进）时，更新本文件的 contract 段
#           旧版本 contract 可删除（历史验证已通过，无需重复）
#
# 退出码：0 全部通过 / 1 有失败（阻断 commit）

# 当前版本 contract（v2.2.55 W286c）
- file: README.md
  checks:
    - must_still_contain: "v2.2.55"
    - must_still_contain: "W286c"

- file: STRUCTURE.md
  checks:
    - must_still_contain: "v2.2.55"
    - must_still_contain: "W286c"

- file: CHANGELOG.md
  checks:
    - must_still_contain: "v2.2.55"
    - must_still_contain: "W286c"

- file: docs/00-导读/项目说明.md
  checks:
    - must_still_contain: "v2.2.55"
    - must_still_contain: "W286c"

- file: 交接文档.md
  checks:
    - must_still_contain: "v2.2.55"
    - must_still_contain: "W286c"

# E3 收尾文档同步铁律门禁（2026-07-31 新增）
# 每次任务完成并 commit 后，必须验证 6 个文档均已同步更新
- file: scripts/output/file-index.md
  checks:
    - must_still_contain: "W286c"
    - must_still_contain: "v2.2.55"

