name: Deploy Pages

# W390 P0 · 部署静态站点到 GitHub Pages（site/ 目录）
# 子路径 /xiyouji/ 已由 rum.js 相对路径 + .nojekyll 适配，无需 base href 改造。
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # W563：部署期把 SW 缓存名戳上 commit SHA——每次部署缓存名必变，
      # activate 自动清旧缓存，SHELL 变更必然生效；sed 只改 CI 工作副本不污染仓库。
      - name: Stamp SW cache version with commit SHA
        run: |
          sed -i "s/const CACHE = \"xiyouji-shell-[^\"]*\"/const CACHE = \"xiyouji-shell-${GITHUB_SHA::7}\"/" site/sw.js
          grep -q "xiyouji-shell-${GITHUB_SHA::7}" site/sw.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # upload-pages-artifact 默认包含点文件（.nojekyll 已随 site/ 一同上传）
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
# FILE_INDEX: .github/workflows/pages.yml | W390 | P0 GitHub Pages 部署
