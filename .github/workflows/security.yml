name: Security

# W236-E E8 安全加固·PR/push 触发四轨并行安全扫描
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# W663/T4 最小权限收敛：CodeQL job 级已提权 security-events: write，其余只读
permissions:
  contents: read

jobs:
  # E8-1 npm 依赖漏洞审计（scripts/ + xiyouji-agent-web/，W410 补 agent-web 覆盖）
  npm-audit:
    name: npm audit (依赖漏洞)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            xiyouji-agent-web/package-lock.json

      - name: 安装依赖（scripts/）
        run: |
          if [ -f scripts/package.json ]; then npm --prefix scripts ci || npm --prefix scripts install; fi

      - name: npm audit（scripts/ · 生产依赖漏洞阻断）
        run: |
          if [ -f scripts/package.json ]; then
            npm --prefix scripts audit --omit=dev --audit-level=high
          else
            echo "无 scripts/package.json，跳过 npm audit"
          fi

      - name: 安装依赖（xiyouji-agent-web/）
        run: |
          if [ -f xiyouji-agent-web/package.json ]; then npm --prefix xiyouji-agent-web ci || npm --prefix xiyouji-agent-web install; fi

      - name: npm audit（xiyouji-agent-web/ · 生产依赖漏洞阻断）
        run: |
          if [ -f xiyouji-agent-web/package.json ]; then
            npm --prefix xiyouji-agent-web audit --omit=dev --audit-level=high
          else
            echo "无 xiyouji-agent-web/package.json，跳过 npm audit"
          fi

  # E8-2 Python 依赖漏洞审计
  pip-audit:
    name: pip audit (Python 依赖漏洞)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 安装 pip-audit
        run: pip install pip-audit

      - name: pip-audit（扫描 requirements 漏洞）
        run: |
          if [ -f scripts/requirements.txt ]; then
            pip-audit -r scripts/requirements.txt --strict
          else
            echo "无 scripts/requirements.txt，跳过 pip-audit"
          fi

  # E8-3 CSP 头配置检查
  csp-check:
    name: CSP check (内容安全策略)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: 验证 HTML 文件 CSP 头配置
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          missing = []
          for html in Path("site").rglob("*.html"):
              text = html.read_text(encoding="utf-8", errors="ignore")
              has_csp = ("Content-Security-Policy" in text) or \
                        ('<meta http-equiv="Content-Security-Policy"' in text)
              # 非阻断：仅记录缺少 CSP 的页面，E8 阶段以提示为主
              if not has_csp:
                  missing.append(str(html))
          if missing:
              print(f"[E8 CSP] 以下 {len(missing)} 个页面未声明 CSP（提示，不阻断）：")
              for p in missing[:10]:
                  print(f"  - {p}")
              if len(missing) > 10:
                  print(f"  ... 共 {len(missing)} 个")
          else:
              print("[E8 CSP] 全部页面已声明 CSP")
          PY

  # E8-4 XSS 漏洞检测
  xss-detect:
    name: XSS detect (危险 API 检测)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: 检测潜在 XSS 漏洞（dangerouslySetHTML / eval / innerHTML 滥用）
        run: |
          # 非严格模式：仅 high 级别问题阻断（可视化页面的 innerHTML 已路径感知降级为 medium）
          python scripts/security_scan.py --all --output scripts/output/security-report.md
          # 双重保险：再次检查 high 数量
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path("scripts/output/security-report.json")
          if not report.exists():
              print("[E8 XSS] 未找到报告，跳过阻断判定")
              raise SystemExit(0)
          data = json.loads(report.read_text(encoding="utf-8"))
          high = sum(1 for f in data.get("findings", []) if f.get("severity") == "high")
          if high > 0:
              print(f"[E8 XSS] 发现 {high} 个 high 级别问题，阻断合并")
              raise SystemExit(1)
          print(f"[E8 XSS] high 级别问题数：{high}，通过")
          PY
  # B-2 CodeQL 静态分析（js/py 双矩阵·W644 登记）
  codeql:
    name: CodeQL 静态分析 (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: "/language:${{ matrix.language }}"

