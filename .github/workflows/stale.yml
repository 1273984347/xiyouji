# W683：Stale——陈旧 issue/PR 自动提醒（60 天标记·再 14 天关闭）·starter: automation/stale.yml
# 每日 01:30 UTC + workflow_dispatch（首跑/手动触发用）·pinned/永久保留 豁免
name: Mark stale issues and pull requests
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          repo-token: ${{ github.token }}
          days-before-stale: 60
          days-before-close: 14
          operations-per-run: 100
          stale-issue-message: '该 issue 超过 60 天无活动，已标记 stale；再 14 天无新活动将自动关闭——如需保留请评论续期。'
          stale-pr-message: '该 PR 超过 60 天无活动，已标记 stale；再 14 天无新活动将自动关闭——dependabot PR 如仍需要请评论 @dependabot rebase 续期。'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,永久保留'
          exempt-pr-labels: 'pinned'
