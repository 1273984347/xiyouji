# W683：OpenSSF Scorecard 安全评分（每周一 03:00 UTC + 分支保护规则变更 + 手动）·starter: code-scanning/scorecard.yml
# 公共仓 publish_results=true（评分发布 OpenSSF REST·SARIF 入 Code scanning）·零密钥（id-token 由 GitHub 签发）
name: OpenSSF Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
          compression-level: 0
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: results.sarif
