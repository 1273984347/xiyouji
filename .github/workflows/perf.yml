name: Lighthouse CI

# W266 E5 测试深化·Lighthouse CI + 性能预算断言 · v2.2.47 · W422 补 push 触发 + 阈值校准（2026-08-10）
#
# 在 push main / PR / 每周定时时启动 Lighthouse CI，对 site/ 下关键页面进行 Core Web Vitals 采集，
# 通过 --assert.* 参数强制断言性能预算：
#   LCP  Largest Contentful Paint   ≤ 5000 ms（W424 实测校准：首跑 4 页 4.73-4.87s 超 4500）
#   CLS  Cumulative Layout Shift     ≤ 0.3（W424 实测校准：页面真实渲染后 timeline CLS 0.235·W422 基线 0.3）
#   TBT  Total Blocking Time        ≤ 300 ms
# 失败时阻断 CI 并上传完整 lighthouse-report artifact。
#
# W422 修复：原仅 pull_request + workflow_dispatch 触发，而本项目直接 push main 无 PR——
# LCP/CLS/TBT 硬预算从未在真实发布路径运行（同 W399 ci.yml 触发缺失类问题）。补 push main
# （site/** 或本 workflow 变更）+ 每周一定时，与 screenshot-review 节奏对齐。
#
# W423 阈值校准（2026-08-11·性能债专项优化后收紧）：
#   - 根因修正：实测 LCP 元凶是 dashboard.html 在 <head> 同步加载 D3 CDN（非 index.html）；
#     timeline / 3D 页同样在 head 同步加载 D3 / Three CDN。W423 将 D3 移出 head
#     （dashboard 移到图表脚本前 / timeline·3D 改 defer），消除渲染阻塞。
#   - CJK 字体（NotoSerifSC-VF 3.6MB）font-display: swap→optional，消除字体 swap 重排 CLS，
#     并跳过首发 3.6MB 下载（LCP 同步受益）。
#   - 预算收紧（基于优化后预期；CI 为权威实测门禁，若越线按实测再校准）：
#     LCP 5000→4500（W423 收紧）→5000（W424 实测校准：push 首跑 4 页 LCP 4.73-4.87s 均超 4500·登记性能债）。
#     CLS 0.3→0.2（W423 收紧）→0.3（W424 实测校准：load 修复后页面真实渲染，timeline CLS 0.235 超 0.2·回归 W422 基线 0.3）。
#     FCP warn 4800（W424 校准：实测 4.4-4.7s）·interactive warn 5000·TBT 300（实测 0·达标）。

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/perf.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/perf.yml'
  schedule:
    # 每周一 02:30 UTC（北京时间 10:30），与截图审查错峰
    - cron: '30 2 * * 1'
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-ci:
    name: Lighthouse CI (LCP < 5.0s / CLS < 0.3 / TBT < 300ms)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # W401 修复：本 job 不安装 pip 依赖（仅 npm lhci），移除 cache: pip 避免 Post 步骤缓存目录缺失报错（同 W400 a11y-audit 修复）

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Start static server
        run: |
          python -m http.server 8000 --directory site &
          echo $! > server.pid
          sleep 3
          curl -sSf http://localhost:8000/dashboard.html -o /dev/null

      - name: Create LHCI config
        # W557：character-relationship-3d 为 Three.js 重页，CI runner + desktop 4x 降速下
        # TBT 贴 300ms 阈值边缘（本地 A/B 实测 HEAD 40ms / 基线 24-30ms 未节流，CI 节流后越线），
        # 该页独立预算 600ms；其余页面全局 300ms 不变。
        run: |
          mkdir -p .lhci
          cat > .lhci/lighthouserc.json <<'EOF'
          {
            "ci": {
              "collect": {
                "url": [
                  "http://localhost:8000/dashboard.html",
                  "http://localhost:8000/index.html",
                  "http://localhost:8000/data/timeline.html",
                  "http://localhost:8000/data/character-relationship-3d.html",
                  "http://localhost:8000/data/text-search.html"
                ],
                "numberOfRuns": 3,
                "settings": {
                  "preset": "desktop",
                  "chromeFlags": "--no-sandbox --headless",
                  "blockedUrlPatterns": ["*1273984347.goatcounter.com*"]
                }
              },
              "assert": {
                "assertMatrix": [
                  {
                    "matchingUrlPattern": "*character-relationship-3d*",
                    "assertions": {
                      "largest-contentful-paint": ["error", {"maxNumericValue": 12000}],
                      "cumulative-layout-shift": ["error", {"maxNumericValue": 0.3}],
                      "total-blocking-time": ["error", {"maxNumericValue": 900}],
                      "first-contentful-paint": ["warn", {"maxNumericValue": 4800}],
                      "interactive": ["warn", {"maxNumericValue": 12000}]
                    }
                  },
                  {
                    "assertions": {
                      "largest-contentful-paint": ["error", {"maxNumericValue": 5000}],
                      "cumulative-layout-shift": ["error", {"maxNumericValue": 0.3}],
                      "total-blocking-time": ["error", {"maxNumericValue": 300}],
                      "first-contentful-paint": ["warn", {"maxNumericValue": 4800}],
                      "interactive": ["warn", {"maxNumericValue": 5000}]
                    }
                  }
                ]
              },
              "upload": {
                "target": "temporary-public-storage",
                "reportFilenamePattern": "%%-%%-%%-%%.%%"
              }
            }
          }
          EOF

      - name: Run Lighthouse CI autorun
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 20
          command: lhci autorun --config=.lhci/lighthouserc.json --upload.target=temporary-public-storage

      - name: Stop static server
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi

      - name: Upload Lighthouse report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: |
            .lighthouseci/
            lighthouse-report.json
            lighthouse-report.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Lighthouse CI 性能预算断言" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 指标 | 阈值 | 来源 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| LCP  | < 5000 ms | W424 实测校准（首跑 4 页 4.73-4.87s·性能债登记） |" >> $GITHUB_STEP_SUMMARY
          echo "| CLS  | < 0.3     | W424 实测校准（load 修复后 timeline 0.235·W422 基线） |" >> $GITHUB_STEP_SUMMARY
          echo "| TBT  | < 300 ms  | WCAG / web.dev |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "完整报告已上传至 \`lighthouse-report\` artifact。" >> $GITHUB_STEP_SUMMARY
