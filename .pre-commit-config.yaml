# pre-commit 钩子配置
# 用途：git commit 时自动运行 ruff lint + 文档一致性校验
# 安装：pip install pre-commit && pre-commit install
# 跳过：git commit --no-verify
#
# ⚠️ 双门禁说明（W424）：本仓库当前实际生效的是【手动零依赖钩子】.git/hooks/pre-commit（运行 verify_delivery.py）。
#    `pre-commit install` 会覆盖该手动钩子——本配置已含等价 verify-delivery 钩子，覆盖后核心门禁不丢失；
#    未安装框架时以手动钩子为准。两套钩子功能重叠但互不冲突，勿重复安装/删除。

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        name: ruff lint (scripts/)
        args: [--fix]
        files: ^scripts/.+\.py$
        # 遵循 pyproject.toml 中的 ruff 配置

  - repo: local
    hooks:
      # W1014：删除原 sync-docs 钩子——它 `entry: python scripts/sync_docs.py` 指向
      # W793 已退役的不存在件（sync_docs.py 退休替换为现役门禁），休眠配置里潜伏，
      # 一旦 `pre-commit install` + commit 即卡在缺失脚本（正是 AGENTS §4.3 警告的后果）。

      - id: verify-delivery
        name: 交付校验门禁 (verify_delivery.py)
        entry: python scripts/verify_delivery.py
        language: system
        pass_filenames: false
        always_run: true
        # 与手动钩子 .git/hooks/pre-commit 等价（六文档版本/A4 209 计数/范围漂移/导航/链接/sitemap/回退）
        # W424 补入框架配置：防止 pre-commit install 覆盖手动钩子后核心门禁静默消失

      - id: drl-contracts
        name: DRL contract 批量验证 (drl_spotcheck.py --batch)
        entry: python scripts/drl_spotcheck.py --batch scripts/drl_contracts.yaml
        language: system
        pass_filenames: false
        always_run: true
        # E1 升级版铁律工程化：验证"修复声明已落地"的文件内容实际包含期望值
        # 失败时阻断 commit；更新 contract 见 scripts/drl_contracts.yaml

      - id: check-untracked
        name: 交付物 untracked 文件检测 (check_untracked.py)
        entry: python scripts/check_untracked.py
        language: system
        pass_filenames: false
        always_run: true
        # E1 铁律工程化：检测 docs/site/data/scripts/ 中 untracked 文件
        # 警告不阻断 commit（可能有合理未跟踪文件）

      - id: pytest
        name: pytest 测试套件
        entry: python -m pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]  # W1014: 原 [commit] 为废弃 stage 名（validate-config 告警·migrate-config 同款）
