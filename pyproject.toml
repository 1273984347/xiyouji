[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    # W400 修复：跳过一次性开发/诊断脚本（_ 前缀）与历史归档目录，
    # 与 security_scan.py discover_files() 的跳过逻辑一致 —— 它们非生产代码，不应阻断 CI 门禁
    "**/_*.py",
    "scripts/audit/archive",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # 行长由 line-length 控制
    "UP031",  # W400 修复：printf 风格 `%` 格式化在存量脚本中大量使用（34 处历史代码），
    # 非错误且改 f-string 存在 % 转义语义风险；作为可选风格升级不阻断 CI 门禁
]

[tool.ruff.lint.per-file-ignores]
"scripts/audit/*" = ["F401"]  # 临时脚本允许未使用 import
"tests/*" = ["F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# 注：pytest 配置位于根目录 pytest.ini（优先级高于 pyproject.toml）
