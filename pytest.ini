[pytest]
testpaths = tests
# W401 修复：tests/e2e/ 含需 playwright+chromium 的 browser-fixture 测试
# （test_narratology_render.py），CI 的 pytest-unit job 不装 playwright → 默认排除；
# 浏览器 E2E 由 ci.yml screenshots-regression job 覆盖。
addopts = -v --tb=short --strict-markers --ignore=tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: 标记慢测试（可用 -m 'not slow' 跳过）

# ============================================================================
# 覆盖率口径决策（W776·外部评审 A-01 立项执行·2026-10-17 实证）
# ============================================================================
# 决策：本项目不采用「单一覆盖率数字」，不引入 pytest-cov / --cov 门禁。
# 实证依据（pytest --cov=scripts 一次性测量·2026-10-17·pytest 602 passed 不变）：
#   全 scripts/ TOTAL 18%（23762 语句）·门禁层（check_* + utils +
#   verify_delivery/docs_index/stats）24%（4647 语句）·计时开销 +82%（45s→82s）。
# 该数字结构性失真的三个原因（任一均无法靠调口径消除）：
#   ① 门禁验证的主路径是子进程——verify_delivery 以 subprocess 跑 49 个门禁段、
#      测试亦以 subprocess 调 JS 门禁，coverage.py 进程本地、跨进程失明；
#   ② 双轨制——浏览器 E2E / 视觉回归套件按设计排除于 pytest（见上方 W401 注释），
#      由 ci.yml 独立 job 覆盖，pytest 口径的覆盖率先天只含单元/门禁层；
#   ③ 23,762 语句中多数是 34 类数据生成器脚本（A_*~AH_*），其正确性由消费方
#      门禁（第 9/24/40/43 槽等输出级对账）与 self-test 负样本保证，非单元测试面。
# 替代呈现（可机器核验的资产清单，杜绝「数字好看但失真」）：
#   pytest 785<!--stats:pytest_collected--> collected（unit 面·tests/e2e 浏览器套件按 W401 排除）
#   + E2E 三套件（冒烟/交互/视觉·10 PNG 基线）+ verify_delivery 51 段（每段门禁自带注入式负样本 self-test）。
#   W830：collected 计数实体化（<!--stats:pytest_collected-->）——原「602 passed」字面量无任何对账，
#   W830 审查实证其已漂移至 770（W808 测试三件套 + W816/W825 修复批新增）而无门禁兜底；stats.py 实算·
#   check_doc_sync C5b 扩展面（pytest.ini 在扫描域·只跑标记对账）恒对账，漂移即红。
# 如未来要引入趋势度量：须先解决子进程合并（coverage combine）与生成器脚本
# 分层口径，且只作报告项、不设阈值门禁（阈值门禁在内容型项目诱发凑数）。
# ============================================================================
