examples:
  - id: evaluate-roadmap
    title:
      zh: 评估路线图/方案文档
      en: Evaluate a Roadmap / Plan Document
    description:
      zh: 按取证硬门槛评估项目方案的可落地性，输出五维评估与证据基线表
      en: Assess plan feasibility via evidence-first verification, outputting a five-dimension review with evidence table
    prompt:
      zh: |-
        请评估 {{方案文档路径，如 docs/superpowers/plans/2026-08-18-phase-e-visual-elevation-roadmap.md}}：
        - 先按 xiyouji-plan-review 流程登记声称清单（数字/引用/基线），再逐项实测取证（git HEAD、页数、脚本存在性、声称 vs 实测对照表）
        - 输出五维评估（可行性/结构/可维护性/性能/风险）+ 优势 + 不足-改进对照表 + 优先行动前三条
        - 阶段 1 取证未完成前禁止下结论
      en: |-
        Please evaluate {{plan document path, e.g. docs/superpowers/plans/2026-08-18-phase-e-visual-elevation-roadmap.md}}:
        - Follow the xiyouji-plan-review workflow: register the claim list (numbers/references/baseline) first, then verify each item against the repo (git HEAD, page counts, script existence, claims-vs-measured table)
        - Output a five-dimension assessment (feasibility/structure/maintainability/performance/risk) + strengths + issues-to-improvements table + top-3 priority actions
        - No conclusions before Phase 1 evidence gathering completes
  - id: check-plan-feasibility
    title:
      zh: 判断方案能否落地
      en: Check Whether a Plan Is Feasible
    description:
      zh: 对方案做可行性快速研判（取证驱动，结论先行）
      en: Evidence-driven feasibility check with a conclusion-first answer
    prompt:
      zh: |-
        判断 {{方案文档路径}} 能不能落地：
        - 用 xiyouji-plan-review 流程实测核对关键数字与引用（重点扫覆盖率声称/工时估算/新建 vs 已有措辞/预算交叉四类偏差）
        - 结论先行：可执行 / 有条件可执行 / 需返工 + 核心理由 + 优先处理点
      en: |-
        Judge whether {{plan document path}} is feasible:
        - Use the xiyouji-plan-review workflow to verify key numbers and references (focus on coverage claims, effort estimates, new-vs-existing wording, and budget cross-checks)
        - Conclusion first: executable / conditionally executable / needs rework + core reasons + top priorities
