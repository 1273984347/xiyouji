examples:
  - id: write-next-phase-roadmap
    title:
      zh: 撰写下一阶段路线图
      en: Write the Next Phase Roadmap
    description:
      zh: 为西游记项目撰写跨批次 W 路线图方案，含现状基线、分批计划与验收门禁
      en: Draft a cross-batch W roadmap for the Xiyouji project, covering baseline, batch plan, and gates
    prompt:
      zh: |-
        请为 xiyouji 项目（D:\1\xiyouji）撰写下一阶段路线图方案。
        方向：{{一句话描述，如"SEO 与可发现性优化"}}
        批次范围：{{如 W###–W###}}
        请按 xiyouji-plan-authoring 流程执行：先读上游方案与 DESIGN.md 取证，再按固定九段结构成文落 docs/superpowers/plans/。
      en: |-
        Please draft the next-phase roadmap for the xiyouji project (D:\1\xiyouji).
        Direction: {{one-line description, e.g. "SEO and discoverability optimization"}}
        Batch range: {{e.g. W###–W###}}
        Follow the xiyouji-plan-authoring workflow: read upstream plans and DESIGN.md first, then write the plan in the fixed nine-section structure under docs/superpowers/plans/.
  - id: derive-visual-upgrade-track
    title:
      zh: 在既有方案之上写视觉升级方案
      en: Derive a Visual Upgrade Plan
    description:
      zh: 在既有路线图基础上衍生视觉/工程升级新轨，含设计规范修宪与闸门联动
      en: Derive a new visual/engineering track from an existing roadmap, including spec revision and gate linkage
    prompt:
      zh: |-
        请在 xiyouji 项目（D:\1\xiyouji）既有方案（{{上游方案路径}}）基础上，再写一份前端视觉升级方案。
        要求：{{美化方向描述，如"提升整体视觉高级感"}}
        注意遵守项目约束（file://、CSP、perf-budget、动效契约），并按 xiyouji-plan-authoring 九段结构成文落 docs/superpowers/plans/。
      en: |-
        Based on the existing plan ({{upstream plan path}}) in the xiyouji project (D:\1\xiyouji), draft a frontend visual upgrade plan.
        Requirements: {{direction, e.g. "elevate overall visual premium feel"}}
        Respect project constraints (file://, CSP, perf-budget, motion contract) and follow the xiyouji-plan-authoring nine-section structure under docs/superpowers/plans/.
